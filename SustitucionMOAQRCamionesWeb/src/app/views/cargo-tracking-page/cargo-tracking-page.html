<div class="cargo-tracking-container">
  @if (cargoData(); as data) {
    <!-- First Section: Header + Shipment Card with #EAE9E9 background -->
    <app-section-wrapper backgroundColor="#EAE9E9">
      <!-- Header with Logo -->
      <header class="header">
        <img src="assets/moa_logo.svg" alt="Molinos agro" class="logo">
      </header>

      <!-- Shipment Card -->
      <app-container>
        <app-shipment-card 
          [ctg]="data.ctg"
          [patente]="data.camion.patente"
          [patenteAcoplado]="data.camion.patenteAcoplado">
        </app-shipment-card>
      </app-container>
    </app-section-wrapper>

    <!-- Second Section: Rest of content with #f5f5f5 background -->
    <app-section-wrapper backgroundColor="#f5f5f5">
      <!-- Stage Progress and Progress Stepper wrapped in container -->
      @if (currentStage(); as stage) {
        <div class="mb-2">
          <app-container>
            <app-stage-progress
              [currentStage]="stage.index"
              [totalStages]="stage.total"
              [stageName]="stage.name"
              [stageDate]="stage.date"
              [estimatedTime]="stage.estimatedTime">
            </app-stage-progress>

            <app-progress-stepper
              [totalSteps]="stage.total"
              [currentStep]="stage.index"
              (stageChanged)="onStageChange($event)">
            </app-progress-stepper>
          </app-container>
        </div>
      }

      <!-- Expandable Sections wrapped in container -->
      <app-container>
        <app-expandable-section 
          title="Información general de la carga"
          navigateTo="carga">
        </app-expandable-section>

        <app-expandable-section 
          title="Información general de la planta"
          navigateTo="planta">
        </app-expandable-section>
      </app-container>

      <!-- Bottom Button -->
      <button class="consult-button" (click)="consultarOtraCTG()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16z" stroke="currentColor" stroke-width="2"/>
          <path d="m13 13 4 4" stroke="currentColor" stroke-width="2"/>
        </svg>
        Consultar otra CTG
      </button>
    </app-section-wrapper>
  }
</div>
