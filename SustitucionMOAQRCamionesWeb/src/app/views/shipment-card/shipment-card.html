<div class="shipment-card">
  <div class="truck-icon">
    <img src="assets/camion_icon.svg" alt="Icono Camion" class="icon">    
  </div>
  <div class="shipment-details">
    <div class="detail-row">CTG {{ ctg() }}</div>
    <div class="detail-row">PATENTE {{ patente() }}</div>
    <div class="detail-row">PATENTE ACOPLADO {{ patenteAcoplado() }}</div>
  </div>
  <button class="expand-button">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>
</div>
