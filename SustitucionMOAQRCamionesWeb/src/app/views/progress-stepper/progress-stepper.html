<div class="progress-stepper">
  <div class="steps-container">
    @for (step of getSteps(); track step) {
      <div class="step-wrapper">
        <button 
          class="step-circle"
          [class.active]="step === currentStep()"
          [class.completed]="step < currentStep()"
          (click)="onStepClick(step)">
          @if (step < currentStep()) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          } @else {
            <span class="step-number">{{ step + 1 }}</span>
          }
        </button>
        
        @if (step < totalSteps() - 1) {
          <div class="step-line" [class.completed]="step < currentStep()"></div>
        }
      </div>
    }
  </div>
  
  <!-- Expand/Collapse button -->
  <button class="expand-button" (click)="onToggleExpanded()">
    <span>{{ isExpanded() ? 'Ver menos' : 'Ver todas las etapas' }}</span>
    <svg 
      width="20" 
      height="20" 
      viewBox="0 0 24 24" 
      fill="none"
      [class.rotated]="isExpanded()">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
