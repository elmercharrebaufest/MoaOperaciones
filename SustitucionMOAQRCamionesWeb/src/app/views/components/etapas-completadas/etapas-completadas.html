<div class="etapas-completadas-container">
  <div class="etapas-completadas-header" (click)="toggleExpanded()">
    <div class="header-content">
      <svg class="clock-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="header-title">Etapas completadas</span>
    </div>
    <svg 
      class="chevron-icon" 
      [class.expanded]="isExpanded()"
      width="20" 
      height="20" 
      viewBox="0 0 20 20" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="etapas-completadas-content" [class.expanded]="isExpanded()">
    <app-stages-list
      [stages]="stages()"
      [currentStageIndex]="currentStageIndex()"
      [rechazado]="rechazado()"
      [caladoEstado]="caladoEstado()"
      (stageClicked)="onStageClick($event)">
    </app-stages-list>
  </div>
</div>
