<div class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon">
      <img src="assets/welcome_icon.svg" alt="Icono Camion" class="icon">
    </div>
    
    <h2 class="modal-title">
      ¡Te damos la bienvenida a la nueva plataforma de seguimiento en planta de Molinos Agro!
    </h2>
    
    <p class="modal-description">
      Una herramienta que te permite seguir de cerca el recorrido de tu carga y acceder a toda la información del proceso.
    </p>
    
    <div class="modal-actions">
      <button class="btn-primary" (click)="onStartTutorial()">
        Comenzar recorrido
      </button>
      <button class="btn-secondary" (click)="onSkipTutorial()">
        Saltar recorrido
      </button>
    </div>
  </div>
</div>
