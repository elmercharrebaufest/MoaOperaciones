<div class="stages-list">
  @for (stage of stages(); track $index; let isLast = $last) {
    <div 
      class="stage-item"
      [class.active]="$index === currentStageIndex()"
      (click)="onStageClick($index)">
      
      <div class="stage-icon">
        <img 
          [src]="getIconPath(stage.nombre)" 
          [alt]="stage.nombre + ' icon'" 
          onerror="this.onerror=null; this.src='assets/etapas/ingreso_icon.svg';" 
          loading="lazy"
        />
      </div>

      <div class="stage-content">
        <div class="stage-header">
          <span class="stage-number">
            ETAPA {{ $index + 1 }} de {{ stages().length }}
          </span>
          
          <div class="stage-status" [ngClass]="getStatusClass(stage.estado)">
            {{ getStatusUppercase(stage.estado) }}
          </div>
          
        </div>
        <div class="stage-name">{{ stage.nombre }}</div>
      </div>
    </div>
    
    @if (!isLast) {
      <hr class="stage-divider">
    }
  }
</div>
