<div class="cargo-tracking-container">
  <app-section-wrapper backgroundColor="#EAE9E9">
    <header class="header">
      <img src="assets/moa_logo.svg" alt="Molinos agro" class="logo">
    </header>

    <app-container>
      <app-shipment-card 
        [ctg]="cargoData().ctg"
        [patente]="cargoData().camion.patente"
        [patenteAcoplado]="cargoData().camion.patenteAcoplado">
      </app-shipment-card>
    </app-container>
  </app-section-wrapper>

  <app-section-wrapper backgroundColor="#f5f5f5" class="content-section">
    @if (currentStage(); as stage) {
      <!-- Single merged container with rounded edges -->
      <app-container [padding]="'p-0'" class="main-content-container">
        <!-- Stage info and progress section -->
        <div class="stage-section">
          <div class="current-stage-info">
            <div class="stage-header-row">
              <div>
                <div class="stage-label">ETAPA ACTUAL {{ stage.index + 1 }} de {{ stage.total }}</div>
                <div class="stage-name">{{ stage.name }}</div>
                <div class="stage-date">{{ stage.date }}</div>
              </div>
              <div [ngClass]="['stage-status', getStatusClass(stage.rawStatus)]">
                {{ stage.status }}
              </div>
            </div>
            
            <div class="stage-description">
              <p>Texto fijo a definir.</p>
              <p class="estimated-time">Tiempo estimado: aprox. {{ stage.estimatedTime }}</p>
            </div>
          </div>

          <app-progress-stepper
            [totalSteps]="stage.total"
            [currentStep]="stage.index"
            [isExpanded]="isExpanded()"
            (stageChanged)="onStageChange($event)"
            (toggleExpanded)="toggleExpanded()">
          </app-progress-stepper>

          <!-- Animated stages list -->
          <div class="stages-list-wrapper" [class.expanded]="isExpanded()">
            <app-stages-list
              [stages]="cargoData().etapas"
              [currentStageIndex]="currentStageIndex()"
              [rechazado]="cargoData().rechazado"
              (stageClicked)="onStageChange($event)">
            </app-stages-list>
          </div>
        </div>

        <!-- Divider between sections -->
        <hr class="section-divider">

        <!-- Expandable sections -->
        <div class="expandable-sections">
          <app-expandable-section 
            title="Información general de la carga"
            navigateTo="carga">
          </app-expandable-section>

          <hr class="section-divider">

          <app-expandable-section 
            title="Información general de la planta"
            navigateTo="planta">
          </app-expandable-section>
        </div>
      </app-container>
    }

    <button class="consult-button" (click)="consultarOtraCTG()">
      <img src="assets/magnifying_glass.svg" alt="Lupa">
      Consultar otra CTG
    </button>
  </app-section-wrapper>
</div>
