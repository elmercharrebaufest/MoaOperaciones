<div class="cargo-tracking-container">
  @if (cargoData(); as data) {
    <app-section-wrapper backgroundColor="#EAE9E9" [roundedBottom]="true">
      <header class="header">
        <img src="assets/moa_full_logo.svg" alt="Molinos agro" class="logo">
      </header>

      <app-container>
        <app-shipment-card 
          [ctg]="data.ctg"
          [patente]="data.camion.patente"
          [patenteAcoplado]="data.camion.patenteAcoplado">
        </app-shipment-card>
      </app-container>

      <button class="actualizar-button" (click)="onActualizar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="refresh-icon">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
        </svg>
        Actualizar
      </button>
    </app-section-wrapper>

    <app-section-wrapper backgroundColor="#f5f5f5" class="content-section">
      @if (currentStage(); as stage) {
        <app-container [padding]="'p-0'" class="main-content-container">
          <div class="stage-section">
            <div class="current-stage-info">
              <div class="stage-header-row">
                <div>
                  <div class="stage-label">ETAPA ACTUAL {{ stage.index + 1 }} de {{ stage.total }}</div>
                  <div class="stage-name">{{ stage.name }}</div>
                  <div class="stage-date">{{ stage.date }}</div>
                </div>
                <div class="stage-status-wrapper">
                  @if (filaTag()) {
                    <div class="stage-fila">
                      {{ filaTag() }}
                    </div>
                  }
                  <div [ngClass]="['stage-status', getStatusClass(stage.rawStatus)]">
                    {{ stage.status }}
                  </div>
                </div>
              </div>
              
              <div class="stage-description">
                <p>Texto fijo a definir.</p>
                <p class="estimated-time">Tiempo estimado: aprox. {{ stage.estimatedTime }}</p>
              </div>
            </div>

            <app-progress-stepper
              [totalSteps]="stage.total"
              [currentStep]="selectedIndex()"
              [isExpanded]="isExpanded()"
              [stages]="data.etapas"
              [rechazado]="data.rechazado"
              (stageChanged)="onStageChange($event)"
              (toggleExpanded)="toggleExpanded()">
            </app-progress-stepper>

            <div class="stages-list-wrapper" [class.expanded]="isExpanded()">
              <app-stages-list
                [stages]="data.etapas"
                [currentStageIndex]="selectedIndex()"
                [rechazado]="data.rechazado"
                [caladoEstado]="caladoEstado()"
                (stageClicked)="onStageChange($event)">
              </app-stages-list>
            </div>
          </div>

          <hr class="section-divider">

          <div class="expandable-sections">
            <app-information-button
              title="Información general de la carga"
              navigateTo="carga">
            </app-information-button>

            <hr class="section-divider">

            <app-information-button 
              title="Información general de la planta"
              navigateTo="planta">
            </app-information-button>
          </div>
        </app-container>
      }

      <button class="consult-button" (click)="consultarOtraCTG()">
        <img src="assets/magnifying_glass.svg" alt="Lupa">
        Consultar otra CTG
      </button>
    </app-section-wrapper>
  }
</div>
