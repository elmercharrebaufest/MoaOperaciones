<div class="redirect-container">
  <div class="redirect-content">
    <div class="icon-wrapper">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#003087" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#003087" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    
    <h1 class="redirect-title">Acceso no autorizado</h1>
    <p class="redirect-message">Debe completar el formulario de búsqueda primero</p>
    
    <div class="countdown-wrapper">
      <div class="countdown-circle">
        <span class="countdown-number">{{ countdown() }}</span>
      </div>
      <p class="redirect-text">Redirigiendo...</p>
    </div>
    
    <button class="redirect-button" (click)="redirectToSearch()">
      Ir ahora
    </button>
  </div>
</div>
