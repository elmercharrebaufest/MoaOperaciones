<div class="not-found-container">
  <div class="not-found-content">
    <div class="error-code">404</div>
    
    <div class="icon-wrapper">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#003087" stroke-width="2"/>
        <path d="M12 8v4M12 16h.01" stroke="#003087" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-message">
      Lo sentimos, la página que estás buscando no existe o ha sido movida.
    </p>
    
    <div class="actions">
      <button class="primary-button" (click)="goToSearch()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver al inicio
      </button>
    </div>
    
    <div class="help-text">
      <p>Si crees que esto es un error, por favor contacta al soporte técnico.</p>
    </div>
  </div>
</div>
