<div class="login-container">
  <div class="image-section">
    <img 
      src="assets/login_image.jpg" 
      alt="Molinos Agro" 
      class="background-image"
    />
    <img 
      src="assets/moa_full_logo.svg" 
      alt="Molinos Agro Logo" 
      class="logo-overlay"
    />
  </div>

  <div class="form-section">
    <div class="logo-desktop">
      <img src="assets/moa_full_logo.svg" alt="Molinos Agro" />
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="ctg" class="form-label">CTG</label>
        <input
          id="ctg"
          type="text"
          class="form-input"
          [ngModel]="ctg()"
          (ngModelChange)="ctg.set($event)"
          name="ctg"
          placeholder=""
          [disabled]="isLoading()"
          autocomplete="off"
        />
        <p class="form-helper">Código de Trazabilidad de Granos</p>
      </div>

      <div class="form-group">
        <label for="patente" class="form-label">Patente del camión</label>
        <input
          id="patente"
          type="text"
          class="form-input"
          [ngModel]="patente()"
          (ngModelChange)="patente.set($event)"
          name="patente"
          placeholder=""
          [disabled]="isLoading()"
          autocomplete="off"
        />
      </div>

        <div class="recaptcha-container">
          <re-captcha
            #recaptchaComponent
            (resolved)="handleCorrectCaptcha($event)"
            [siteKey]="recaptchaSiteKey"
          ></re-captcha>
        </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="isLoading() || (isProduction && !captchaOk)"
        [class.loading]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          Cargando...
        } @else {
          Ingresar
        }
      </button>
    </form>
  </div>
</div>
