<div class="login-container">
  <div class="image-section">
    <img 
      src="assets/search_image.jpg" 
      alt="Molinos Agro" 
      class="background-image"
    />
    <img 
      src="assets/moa_full_logo_white.svg" 
      alt="Molinos Agro Logo" 
      class="logo-overlay"
    />
  </div>

  <div class="form-section">
    <div class="logo-desktop">
      <img src="assets/moa_full_logo.svg" alt="Molinos Agro" />
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="ctg" class="form-label">CTG</label>
        <input
          id="ctg"
          type="text"
          inputmode="numeric"
          class="form-input"
          [class.input-error]="ctgError()"
          [ngModel]="ctg()"
          (ngModelChange)="onCtgChange($event)"
          name="ctg"
          placeholder=""
          [disabled]="isLoading()"
          autocomplete="off"
        />
        <p class="form-helper">Código de Trazabilidad de Granos</p>
        @if (ctgError()) {
          <div class="error-message">
            El CTG solo permite números
          </div>
        }
      </div>

      <div class="form-group">
        <label for="patente" class="form-label">Patente del camión</label>
        <input
          id="patente"
          type="text"
          class="form-input"
          [class.input-error]="patenteError()"
          [ngModel]="patente()"
          (ngModelChange)="onPatenteChange($event)"
          name="patente"
          placeholder=""
          [disabled]="isLoading()"
          autocomplete="off"
        />
        @if (patenteError()) {
          <div class="error-message">
            La patente solo permite números y letras
          </div>
        }
      </div>

      @if (needsCaptcha) {
        <div class="recaptcha-container">
          <re-captcha
            #recaptchaComponent
            (resolved)="handleCorrectCaptcha($event)"
            [siteKey]="recaptchaSiteKey"
          ></re-captcha>
        </div>
      }

      <button
        type="submit"
        class="submit-button"
        [disabled]="isLoading() || (needsCaptcha && !captchaOk)"
        [class.loading]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          Cargando...
        } @else {
          Ingresar
        }
      </button>

      <div class="municipal-warning">
        <img 
          src="assets/info_icon.svg" 
          alt="Information Icon"
          class="warning-icon"
        />
        <p class="warning-text">
          Pague la tasa municipal<br>
          <a 
            href="https://puertomoa.tramitesenlinea.com.ar/login" 
            target="_blank" 
            rel="noopener noreferrer"
            class="warning-link"
          >aquí</a>
        </p>
      </div>
    </form>
  </div>
</div>
