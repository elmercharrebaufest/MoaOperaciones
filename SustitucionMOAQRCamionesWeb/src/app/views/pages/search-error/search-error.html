<div class="error-container">
  <div class="image-section">
    <img 
      src="assets/search_image.jpg" 
      alt="Molinos Agro" 
      class="background-image"
    />
    <img 
      src="assets/moa_full_logo_white.svg" 
      alt="Molinos Agro Logo" 
      class="logo-overlay"
    />
  </div>

  <div class="error-section">
    <div class="logo-desktop">
      <img src="assets/moa_full_logo.svg" alt="Molinos Agro" />
    </div>

    <div class="error-content">
      <img 
          src="assets/info_icon.svg" 
          alt="Information Icon"
          class="info-icon"
        />

      <h1 class="error-title">
        No encontramos resultados con los datos ingresados
      </h1>

      <p class="error-subtitle">
        Por favor, verificá que los datos sean correctos e intentá nuevamente.
      </p>

      <button class="retry-button" (click)="onRetry()">
        Reintentar
      </button>
    </div>
  </div>
</div>
