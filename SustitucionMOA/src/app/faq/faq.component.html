                                                                En dicho caso, deberá comunicarse con nuestro Contact Center vía email a materias.primas@molinosagro.com.ar para gestionar el alta del usuario correctamente.
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div class="panel panel-default documento">
                            <div class="panel-heading faqCategoria2" role="tab" id="heading2" data-toggle="collapse" data-parent="#accordion" href="#categoria2" aria-expanded="false" aria-controls="categoria2">
                                <h4 class="panel-title">
                                    <a class="collapsed aFaqClickCat">
                                        Alta para operar con Molinos Agro
                                        <span aria-hidden="true" id="ok" class="glyphicon glyphicon-chevron-down pull-right grisOscuro">
                                        </span>
                                    </a>
                                </h4>
                            </div>
                            <div id="categoria2" class="panel-collapse collapse preguntasRespuesta2" data-parent="#accordion" role="tabpanel" aria-labelledby="heading2">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta2.1" class="tituloPregunta">Quiero habilitar mi CUIT para operar con Molinos Agro, ¿qué hago?</h4>
                                            En primer lugar, deberás contactar a tu comercial/comprador. Luego, deberás registrar un usuario en MOA Operaciones. Por último, al ingresar tendrás que presentar la documentación requerida por Molinos Agro para operar para iniciar el proceso de alta.                      
                                        <br>
                                        <br>
                                        <h4 id="pregunta2.2" class="tituloPregunta">Soy corredor, ya estoy habilitado y quiero presentar el legajo de un nuevo vendedor, ¿cómo hago?</h4>
                                            En primer lugar, deberás contactar a tu comercial para que sepa que vas a presentar un nuevo vendedor. Luego, tendrás que desplegar la sección de “Alta y Documentación”, ir a “Mis vendedores” y dar click en “Nuevo Vendedor”. Saldrá una pantalla donde tendrás que indicar el nro de CUIT de la empresa que estás queriendo habilitar y luego presentar la documentación requerida para iniciar el proceso de alta.
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="panel panel-default documento">
                            <div class="panel-heading faqCategoria3" role="tab" id="heading3" data-toggle="collapse" data-parent="#accordion" href="#categoria3" aria-expanded="false" aria-controls="categoria3">
                                <h4 class="panel-title">
                                    <a class="collapsed aFaqClickCat">
                                        Generales
                                        <span aria-hidden="true" id="ok" class="glyphicon glyphicon-chevron-down pull-right grisOscuro">
                                        </span>
                                    </a>
                                </h4>
                            </div>
                            <div id="categoria3" class="panel-collapse collapse" data-parent="#accordion" role="tabpanel" aria-labelledby="heading3">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta3.1" class="tituloPregunta">¿Puedo consultar el estado de mi perfil impositivo?</h4>
                                            Si, puede consultar su perfil impositivo en Molinos Agro dentro del portal. Para esto, tendrá que desplegar la sección de “Alta y Documentación” y dar click en “Mi situación fiscal”. Dentro de esta pantalla podrá consultar domicilios registrados, el estado de sus exenciones fiscales, las cuentas bancarias habilitadas para pagos, sus inscripciones en Ing. Brutos, último CM05 presentado, entre otros                      
                                        <br>
                                        <br>
                                        <h4 id="pregunta3.2" class="tituloPregunta">¿Puedo consultar mi cuenta corriente? ¿Dónde?</h4>
                                        Si, el portal dispone de su cuenta corriente con Molinos Agro visualizando todos los comprobantes desde que comenzó a operar con nosotros hasta hoy.
                                        <br>
                                        Si es proveedor o corredor de granos, tendrá que desplegar “Información financiera” en el menú lateral e ingresar a “Cuenta Corriente”.
                                        <br>
                                        Si es proveedor general/no granos, tendrá que desplegar “Mis operaciones” en el menú lateral e ingresar a “Cuenta Corriente”.
                                        <br>
                                        <br>
                                        <h4 id="pregunta3.3" class="tituloPregunta">Soy proveedor/corredor de granos, ¿dónde puedo consultar los pagos realizados y los comprobantes relacionados?</h4>
                                        De manera individual: Tendrá que dirigirse al menú lateral, desplegar “Información Financiera” y dar click en “Pagos”. Visualizará un listado con los pagos recientes, donde podrá filtrar para realizar una búsqueda más rápida y precisa. Haciendo click sobre el nro de ID de Pago podrá ingresar a ver el detalle de dicho pago y descargar los comprobantes asociados.
                                        <br>
                                        <br>
                                        De manera conjunta: Tendrá que dirigirse al menú lateral, desplegar “Información Financiera” y dar click en “Cuenta Corriente”. Luego, ingresar a la solapa “Detalle de Pagos” donde podrá visualizar el detalle de cada pago en manera conjunto. Adicionalmente, podrá buscar por nro de comprobante para conocer en qué pago se incluyó el comprobante consultado.
                                        <br>
                                        <br>
                                        <h4 id="pregunta3.4" class="tituloPregunta">Soy proveedor general/no granos, ¿dónde puedo consultar los pagos realizados y los comprobantes relacionados?</h4>
                                        Para consultar los pagos realizados y sus respectivos comprobantes tendrá que desplegar “Mis operaciones” dentro del menú lateral e ingresar en “Pagos” con la posibilidad de filtrar la información para consultar los pagos de manera más rápida y precisa.
                                        <br>
                                        Haciendo click en el Número de Pago, podrás descargar tanto la orden de pago como los comprobantes de retención relacionados a dicho pago. Además, en la lupa que figura al final del pago consultado podrás visualizar de manera rápida todos los comprobantes vinculados.
                                        <br>
                                        <br>
                                        <h4 id="pregunta3.5" class="tituloPregunta">¿Puedo realizar consultas o reclamos a través de la página?</h4>
                                        Si, podes realizar tus consultas o reclamos a través del portal. Para ello, tendrás que dirigirte a la sección de “Contacto” que se encuentra en el menú lateral.
                                        <br>
                                        <br>
                                        <h4 id="pregunta3.6" class="tituloPregunta">¿Sobre qué puedo hacer consultas o reclamos?</h4>
                                        Por el momento, se pueden hacer consultas generales, reclamos sobre pagos, reclamo sobre retenciones y presentar actualizaciones de legajo.
                                        <br>
                                        Estamos trabajando para incorporar nuevas categorías de consulta/reclamo.
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div *ngIf="isAuthorized('CONSULTAR CARTAS PORTE') && isGranos()" class="panel panel-default documento">
                            <div class="panel-heading" role="tab" id="heading4" data-toggle="collapse" data-parent="#accordion" href="#categoria4" aria-expanded="false" aria-controls="categoria4">
                                <h4 class="panel-title">
                                    <a class="collapsed aFaqClickCat">
                                        Cartas de Porte
                                        <span aria-hidden="true" id="ok" class="glyphicon glyphicon-chevron-down pull-right grisOscuro">
                                        </span>
                                    </a>
                                </h4>
                            </div>
                            <div id="categoria4" class="panel-collapse collapse" data-parent="#accordion" role="tabpanel" aria-labelledby="heading4">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta4.1" class="tituloPregunta">¿Dónde puedo ver mis descargas?</h4>
                                        Para consultar tus entregas en Molinos Agro, tendrás que desplegar la sección de “Mis Operaciones” en el menú lateral y dirigirte a “Cartas de Porte”. Cargará la pantalla, dentro de la solapa “Descargas” podrás consultar tus entregas a través de los filtros dispuestos en la Web.                      
                                        <br>
                                        <br>
                                        <h4 id="pregunta4.2" class="tituloPregunta">¿Puedo ver las cartas de porte aplicadas? ¿Cómo sé a qué negocio están aplicadas?</h4>
                                        Para consultar a qué negocio están aplicadas tus entregas, tendrás que desplegar la sección de “Mis Operaciones” en el menú lateral y dirigirte a “Cartas de Porte”. Cargará la pantalla y tendrás que dirigirte a la solapa “Aplicaciones” y utilizar los filtros para consultar las cartas de porte. Por último, en la columna “Contrato Molinos” podrás visualizar a qué negocio se encuentran asignadas.
                                        <br>
                                        <br>
                                        <h4 id="pregunta4.3" class="tituloPregunta">¿Puedo ver o descargar la imagen de una carta de porte? ¿Y de varias?</h4>
                                        Si, las imágenes de las cartas de porte pueden visualizarse en la página o descargarse. Para visualizarlas, tendrás que ingresar al logo de imagen que se encuentra ubicado del lado derecho del número de carta de porte. Para descargar una o varias, tendrás que seleccionarlas y luego ir al margen superior derecho de la pantalla y dar click en “Descargar”.
                                        <br>
                                        <br>
                                        <h4 id="pregunta4.4" class="tituloPregunta">¿Se puede generar el formulario de la carta de porte a través del portal?</h4>
                                        Si, se puede hacer a través del CTG. Para generarlo tendrás que dirigirte al menú lateral, desplegar la sección de “Mis Operaciones” e ingresar a “Cartas de Porte”. Una vez dentro, hacer click en la solapa “Formulario”, ingresar el nro. de CTG y “Buscar”.
                                        <br>
                                        <br>
                                        <h4 id="pregunta4.5" class="tituloPregunta">Entregué mercadería que todavía no veo aplicada, ¿qué hago?</h4>
                                        La aplicación de la mercadería se realiza al día hábil siguiente de la entrega. Si pasado ese tiempo, la mercadería no se encuentra aplicada tendrás que <a href="web/contacto">comunicarte con nosotros.</a>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div *ngIf="isAuthorized('CONSULTAR CONTRATOS') && isGranos()" class="panel panel-default documento">
                            <div class="panel-heading" role="tab" id="heading5" data-toggle="collapse" data-parent="#accordion" href="#categoria5" aria-expanded="false" aria-controls="categoria5">
                                <h4 class="panel-title">
                                    <a class="collapsed aFaqClickCat">
                                        Contratos
                                        <span aria-hidden="true" id="ok" class="glyphicon glyphicon-chevron-down pull-right grisOscuro">
                                        </span>
                                    </a>
                                </h4>
                            </div>
                            <div id="categoria5" class="panel-collapse collapse" data-parent="#accordion" role="tabpanel" aria-labelledby="heading5">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta5.1" class="tituloPregunta">¿Cómo puedo consultar la información sobre un negocio? ¿Y si desconozco el número de contrato?</h4>
                                        Deberás desplegar la sección de “Mis Operaciones” en el menú lateral. Luego, tendrás que ingresar a “Contratos”. Una vez dentro, podrás filtrar la información por nro. de contrato.
                                        <br>
                                        En el caso de no conocer el nro. de contrato de tu operación, podrás utilizar el resto de los filtros para ubicar el negocio deseado
                                        <br>
                                        <br>
                                        <h4 id="pregunta5.2" class="tituloPregunta">¿Puedo consultar mis fijaciones? ¿Y las específicas de un contrato?</h4>
                                        Si, dentro de “Mis Operaciones” ingresando a “Contratos” podrás consultar tus fijaciones en la solapa de “Fijaciones” donde dispones de múltiples filtros para consultar las fijaciones de forma más rápida y precisa. Dentro de los filtros, se encuentra el filtro “Por contrato” donde podrás consultar a través del nro. de contrato, las fijaciones asociadas a un negocio puntual.
                                        <br>
                                        <br>
                                        <h4 id="pregunta5.3" class="tituloPregunta">¿Puedo ver las ampliaciones de mis negocios? ¿Y las anulaciones?</h4>
                                        Si, ambas pueden consultarse en el portal. Para ello, tendrás que dirigirte al menú lateral, desplegar “Mis Operaciones” e ingresar a “Contratos”. Una vez cargada la pantalla, tendrás dos solapas en el margen superior, una para ver las ampliaciones y otra para anulaciones. En ambos casos, podrás filtrar para consultar la información de manera más rápida y precisa.
                                        <br>
                                        <br>
                                        <h4 id="pregunta5.4" class="tituloPregunta">¿Puedo ver las condiciones de un negocio? ¿Dónde?</h4>
                                        Si, se pueden ver las condiciones pactadas del negocio en el portal. Para esto, tendrás que desplegar “Mis Operaciones” en el menú lateral e ingresar a “Contratos”. Dentro de la solapa “Vigentes”, tendrás que utilizar los filtros para ubicar el contrato deseado y luego hacer click sobre el número de contrato para dirigirte a las condiciones del negocio.
                                        <br>
                                        <br>
                                        <h4 id="pregunta5.5" class="tituloPregunta">¿Qué información puedo visualizar en el detalle del contrato?</h4>
                                        En el detalle de contrato podrás consultar toda la información relacionada al mismo como el estado del contrato, el grano, el precio pactado, la cantidad acordada, destino de entrega, periodo de entrega, cosecha, fecha de concertación, standard de calidad, cantidad entregada y liquidada, condiciones comerciales, bonificaciones y rebajas acordadas previamente dentro y fuera del precio. Además, todo lo relacionado a la liquidación y pago del negocio como por ejemplo, el estado del boleto y seguimiento del mismo, la fecha y detalle de pago de las liquidaciones asociadas, las proformas correspondientes, las aplicaciones, ampliaciones y anulaciones, y las calidades de todas las cartas de porte asociadas al negocio.
                                        <br>
                                        <br>
                                        <h4 id="pregunta5.6" class="tituloPregunta">¿Puedo descargar la imagen del boleto?</h4>
                                        Si, el portal dispone de la posibilidad de descargar el boleto siempre y cuando se trate de un boleto físico emitido por Molinos Agro. En el caso de que haya sido emitido por la contraparte, no se podrá consultar. Los boletos acordados para realizarse por Confirma se tendrán que descargar por dicha página.  
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div *ngIf="isAuthorized('CONSULTAR LIQUIDACIONES') && isGranos()" class="panel panel-default documento">
                            <div class="panel-heading" role="tab" id="heading6" data-toggle="collapse" data-parent="#accordion" href="#categoria6" aria-expanded="false" aria-controls="categoria6">
                                <h4 class="panel-title">
                                    <a class="collapsed aFaqClickCat">
                                        Liquidaciones
                                        <span aria-hidden="true" id="ok" class="glyphicon glyphicon-chevron-down pull-right grisOscuro">
                                        </span>
                                    </a>
                                </h4>
                            </div>
                            <div id="categoria6" class="panel-collapse collapse" role="tabpanel" aria-labelledby="heading6">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta6.1" class="tituloPregunta">¿Dónde puedo visualizar mis liquidaciones?</h4>
                                        Dentro del portal, podrás consultar el estado de tus liquidaciones desplegando “Mis operaciones” en el menú lateral e ingresando a “Liquidaciones” dentro de las siguientes solapas: Aprobadas – Observadas – Pagas.
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.2" class="tituloPregunta">¿Qué debo hacer si no veo una liquidación en el portal?</h4>
                                        Depende de la fecha de emisión de la liquidación. Si se trata de un comprobante emitido en el día o el día anterior puede ser que todavía no figure en el portal. Dentro de las 24 horas hábiles de la emisión, el comprobante tendría que figurar en la Web, en primera instancia dentro de la solapa “Observadas” con la observación de “En proceso de contabilización”. Pasadas las 24 horas mencionadas, la liquidación tendría que figurar como aprobada u observada con su correspondiente observación en sus respectivas solapas. Caso contrario, tendrán que comunicarse con nosotros a través de <a href="web/contacto">nuestros datos de contacto.</a>
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.3" class="tituloPregunta">¿Qué debo hacer si veo mi liquidación como observada?</h4>
                                        Las observaciones de las liquidaciones suelen ser específicas.
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.4" class="tituloPregunta">¿Qué debo hacer si veo mi liquidación con la observación: “Comunicarse con el Contact Center”?</h4>
                                        Tendrás que comunicarte con nuestro sector de atención para conocer más sobre el estado de tu liquidación. <a href="web/contacto">Ver datos de contacto.</a>
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.5" class="tituloPregunta">Mi liquidación ya venció y todavía no figura dentro de la solapa de “Pagas”, ¿qué debo hacer?</h4>
                                        En primer lugar, verificar si la liquidación no fue observada por algún motivo. Si no figura dentro de “Observadas” tendrás que comunicarte con nosotros. <a href="web/contacto">Ver datos de contacto.</a>
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.7" class="tituloPregunta">¿Puedo emitir una liquidación parcial de un negocio en dólares sin pesificar?</h4>
                                        No. Deberás pesificar los kilos deseados para liquidar antes de emitir la liquidación.
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.8" class="tituloPregunta">¿Puedo emitir una liquidación sobre descargas que no están aplicadas a ningún negocio?</h4>
                                        No. Sólo se pueden liquidar entregas que se encuentren aplicadas a un negocio.
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.9" class="tituloPregunta">Tengo dos fijaciones de un mismo negocio para liquidar, ¿puedo liquidarlas en conjunto?</h4>
                                        No. Deben liquidarse por separado por más de que las condiciones sean las mismas.
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.10" class="tituloPregunta">¿Puedo ver la proforma para emitir la liquidación final de un negocio?</h4>
                                        Podrás acceder a la proforma de la final dentro del detalle del contrato en la sección de liquidaciones, siempre y cuando ya se haya emitido el pago de la parcial.
                                        <br>
                                        <br>
                                        <h4 id="pregunta6.11" class="tituloPregunta">Veo que la proforma de una final dice “Faltan datos de calidad” o “Faltan Gastos Cámara”, ¿la puedo liquidar igual?</h4>
                                        No. Tendrás que esperar a que estén los resultados de calidad de las cartas de porte para poder liquidar ya que los importes a liquidar pueden variar según las calidades resultantes.    
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div *ngIf="isAuthorized('PESIFICACION') && isGranos()" class="panel panel-default documento">
                            <div class="panel-heading" role="tab" id="heading7" data-toggle="collapse" data-parent="#accordion" href="#categoria7" aria-expanded="false" aria-controls="categoria7">
                                <h4 class="panel-title">
                                    <a class="collapsed aFaqClickCat">
                                        Pesificaciones
                                        <span aria-hidden="true" id="ok" class="glyphicon glyphicon-chevron-down pull-right grisOscuro">
                                        </span>
                                    </a>
                                </h4>
                            </div>
                            <div id="categoria7" class="panel-collapse collapse" role="tabpanel" aria-labelledby="heading7">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta7.1" class="tituloPregunta">¿Debo pesificar todos mis negocios?</h4>
                                        Si, siempre que sean en moneda dólar.
                                        <br>
                                        <br>
                                        <h4 id="pregunta7.2" class="tituloPregunta">¿Puedo liquidar un negocio en dólares sin haberlo pesificado?</h4>
                                        No. Todos los negocios en dólares deben pesificarse antes de ser liquidados.
                                        <br>
                                        <br>
                                        <h4 id="pregunta7.3" class="tituloPregunta">¿Cómo pesifico un negocio en dólares? ¿Puedo pesificar más de uno a la vez?</h4>
                                        Debes dirigirte al menú lateral, desplegar la opción “Operar” e ingresar en “Pesificación”.
                                        <br>Luego, tendrás la opción de pesificar individual o masivamente. A continuación, te indicamos cómo hacerlo:
                                        <br>
                                        <br>
                                        <ul>
                                            <li>
                                                <bolder style="font-weight: bolder;">Pesificación individual:</bolder> Deberás completar los campos: “Contrato”, con los siete números que identifican el negocio y “Kilos”, representados en números enteros. Adicionalmente, si se trata de un negocio con fijaciones de precio, deberás indicar qué fijación estás pesificando. Una vez completo, quedaría de la siguiente manera:
                                                <br>
                                                <br>
                                                <div class="col-md-12">
                                                    <img src="Content/images/PesificacionIndividual1.JPG" style="max-width: 100%; max-height: 100%; margin-bottom: 10px;">
                                                </div>
                                                <br>
                                                <br>
                                                Posteriormente, tendrás que dar click en “Enviar” y aceptar la confirmación de la pesificación.
                                                <br>
                                                <br>
                                                <div class="col-md-12">
                                                    <img src="Content/images/PesificacionIndividual2.JPG" style="max-width: 100%; max-height: 100%; margin-bottom: 10px;">
                                                </div>
                                            </li>
                                            <br>
                                            <br>
                                            <li>
                                                <bolder style="font-weight: bolder;">Pesificación Masiva:</bolder> Te dejamos un instructivo para que puedas ver el paso a paso de cómo pesificar tus negocios de manera conjunta.
                                                <div class="col-xs-12">
                                                    <a href="../../../Documentacion/Pesificados carga masiva.docx" target="_blank"
                                                        style="text-decoration:none!important">
                                                        <div class="documento">
                                                            <p><i class="fa fa-file-word-o" aria-hidden="true"></i>Carga masiva</p>
                                                            Se detallan como generar el archivo a subir para una carga masiva de
                                                            pesificaciones
                                                        </div>
                                                    </a>
                                                </div>
                                            </li>
                                        </ul>
                                        <br>
                                        <br>
                                        <h4 id="pregunta7.4" class="tituloPregunta">¿Qué tipo de cambio debo tomar para liquidar?</h4>
                                        Deberás tomar el tipo de cambio divisa comprador del Banco Nación de la fecha indicada al momento de la pesificación.
                                        <br>
                                        <br>
                                        <h4 id="pregunta7.5" class="tituloPregunta">¿Puedo pesificar en cualquier momento del día?</h4>
                                        Si, podes pesificar en todo momento, pero deberás tener en cuenta que se tomará el tipo de cambio de cierre del día que estás pesificando hasta las 14:00. Todas las pesificaciones que ingresen luego del horario mencionado quedarán pesificadas al tipo de cambio del día hábil siguiente.
                                        <br>
                                        <br>
                                        <h4 id="pregunta7.6" class="tituloPregunta">¿Puedo consultar los negocios que tengo pendiente de pesificar?</h4>
                                        Si, podes consultarlos. Tendrás que dirigirte al menú lateral, desplegar la opción de “Operar” e ingresar en “Pesificación”. Luego, verás 3 pestañas distintas, la última contiene la información con los negocios pendientes de pesificar.
                                        <br>
                                        <br>
                                        <h4 id="pregunta7.8" class="tituloPregunta">Quise pesificar un negocio pero me da el siguiente error: “El contrato que desea pesificar no se encuentra o bien ya fue pesificado completamente”, ¿qué hago?</h4>
                                        Deberás verificar el formato de los datos ingresados, ya que puede ser que alguno esté ingresado incorrectamente o consultar la pestaña de “Pendiente” para ver si el negocio que estás queriendo ingresar figura, de lo contrario, ya estaría pesificado.    
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div *ngIf="isAuthorized('CONSULTAR CONTRATOS') && isGranos()" class="panel panel-default documento">

                            </div>
                            <div id="categoria11" class="panel-collapse collapse" role="tabpanel" aria-labelledby="heading11">
                                <div class="panel-body">
                                    <label class="faqTexto">
                                        <h4 id="pregunta11.1" class="tituloPregunta">¿Dónde puedo visualizar mis facturas en la Web?</h4>
                                        Dentro del portal, podrás consultar el estado de tus Facturas desplegando “Mis operaciones” en el menú lateral e ingresando a “Comprobantes” dentro de las siguientes solapas: Aprobadas – Observadas.
                                        <br>
                                        <br>
                                        <h4 id="pregunta11.2" class="tituloPregunta">¿Qué debo hacer si mi Factura se encuentra observada?</h4>
                                        En caso de que tu Factura se encuentre observada, vas a poder visualizar el motivo por el cual se encuentran observadas, directamente en la WEB.
                                        <br>
                                        <br>
                                        <h4 id="pregunta11.3" class="tituloPregunta">¿Qué debo hacer si no veo mi Factura en el portal?</h4>
                                        En caso de no ver tu factura en el portal podrás adjuntarla, desplegando “Mis Operaciones” en el menú lateral e ingresando a “Factura”, o enviar tu factura por mail, a proveedoresgraneles@molinosagro.com.ar   
                                        <br>
                                        <br>
                                        <h4 id="pregunta11.4" class="tituloPregunta">¿como deben emitirse las facturas de credito electronicas?</h4>
                                        Es importante que a la hora de emitir una FCE se tengan en cuenta las siguientes cuestiones:<br>
                                        <ul>
                                            <li>
                                                Se debe facturar una vez completado el servicio o entregado completamente el material.
                                            </li>
                                            <li>
                                                Indicar en el comprobante el numero de orden de compra o el representante de MOA que contrató el servicio.
                                            </li>
                                            <li>
                                                ES MUY IMPORTANTE que la fecha de vencimiento que se le coloque al comprobante COINCIDA con la acordada al momento de la contratación, de lo contrario el comprobante será rechazado.
                                            </li>
                                            <li>
                                                Se debe poner a disposición de MOA el PDF original correspondiente a la siguiente casilla: proveedoresgraneles@molinosagro.com.ar
                                            </li>
                                        </ul>   
                                        <br>
                                        <br>
                                        <h4 id="pregunta11.5" class="tituloPregunta">¿como se deben emitir comprobantes en moneda extranjera? (USD/EUR)</h4>
                                        Conforme a la Ley 24.760, el emisor está obligado a emitir NC espejo código 203 para anular los comprobantes rechazados.<br>
                                        La refacturación, si corresponde, deber respetar las condiciones del documento original, incluidos los días de condición de pago para establecer el nuevo vencimiento. Dicha NC debe también enviarse a la casilla de recepción de comprobantes para su correspondiente declaración.   
                                        <br>
                                        <br>
                                        <h4 id="pregunta11.6" class="tituloPregunta">¿Qué hago si me rechazaron una factura de credito electronica?</h4>
                                        Molinos Agro adopta para todas sus operaciones el Tipo de Cambio DIVISAS VENDEDOR BANCO NACION correspondiente al día anterior a la fecha de factura con la totalidad de los decimales publicados ese día
                                        <br>
                                        <br>
                                        <h4 id="pregunta11.7" class="tituloPregunta">¿como se deben emitir las diferencias de tipo de cambio?</h4>
                                        Su comprobante en moneda extranjera será abonada al tipo de cambio de emisión, no obstante, se reconocerá la diferencia de cambio existente entre el tipo de cambio de facturación y el tipo de cambio del día del pago previa emisión de la nota de debito correspondiente. Siempre el TC utilizado es la cotización DIVISAS VENDEDOR BANCO NACION.<br>
                                        El cálculo se realiza según este ejemplo:<br>
                                        <br>
                                        <ul>
                                            FC en USD por 1000 a TC de emisión 80<br>
                                            Pago $ 80.000 TC del día del pago 90<br>
                                            <br>
                                            Diferencia de TC: 1000x90 – 1000x80 = $10.000<br>
                                            <br>
                                            ND a emitir: Neto: $ 8.264,46 IVA: $1.735,54 TOTAL: $ 10.000
                                        </ul>
                                    </label>
                                </div>
                            </div>
                        </div>
