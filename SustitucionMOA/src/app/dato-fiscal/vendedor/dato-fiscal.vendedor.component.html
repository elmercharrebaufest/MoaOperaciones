<div class="content-wraper">
    <!-- CONTENT-->

    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 ">Dato Fiscal: <strong>Vendedores</strong> </div>
        </div>
        <!--End Title-->
        <div class="row myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow animate">
                <div class="col-xs-12 col-md-12 search-header">
                    <title-caps>Refinar resultados</title-caps>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6">
                    Por Vendedor:
                    <div class="styled-select">
                        <input type="search" class="" placeholder="" [value]="filtroVendedor"
                            (input)="filtroVendedor = $event.target.value" aria-controls="tableModal">
                    </div>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6">
                    Por Nro. Vendedor:
                    <div class="styled-select">
                        <input type="search" class="" placeholder="" [value]="filtroNroVendedor"
                            (input)="filtroNroVendedor = $event.target.value" aria-controls="tableModal">
                    </div>
                </div>
            </div>
        </div>

        <div class="row myRow">
            <div class="clearfix myTables">

                <mensaje></mensaje>
                <spinner></spinner>

                <table *ngIf="isVisible()" id="tableModal"
                    class="display nowrap dataTable no-footer dtr-inline rounded shadow animate " cellspacing="0"
                    role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('descVendedor')">
                                Vendedor</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('idVendedor')">Nro.
                                Vendedor</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('Estado')">Estado
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let vendedor of data | orderedColumn : {property: orderedByColumn, direction: orderDirection}  | customFilter : 'descVendedor' : filtroVendedor | customFilter : 'idVendedor' : filtroNroVendedor | paginate: { itemsPerPage:itemsPerPage, currentPage: p } ; let odd = odd"
                            role="row" [class.odd]="!odd">
                            <td>
                                <a *ngIf="isCorredor()" class="animate"
                                    (click)="goToSeccionParamDos('/dato-fiscal/situacion-fiscal', vendedor.idVendedor, vendedor.descVendedor)"
                                    href="#">{{vendedor.descVendedor}}</a>
                                <label *ngIf="!isCorredor()">{{vendedor.descVendedor}}</label>
                            </td>
                            <td>{{vendedor.idVendedor}}</td>
                            <td>{{vendedor.estado}}</td>
                        </tr>
                    </tbody>
                </table>

                <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="isVisible()">
                    <div class="dataTables_paginate paging_simple_numbers">
                        <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()"
                            [class.disabled]="pT.isFirstPage()"> Anterior </a>
                        <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
                            <a class="paginate_button" (click)="pT.setCurrent(page.value)"
                                *ngIf="pT.getCurrent() !== page.value">{{ page.label }}</a>
                            <a class="paginate_button current"
                                *ngIf="pT.getCurrent() === page.value">{{ page.label }}</a>
                        </span>
                        <a id="tableModal_next" class="paginate_button next" (click)="pT.next()"
                            [class.disabled]="pT.isLastPage()"> Siguiente </a>
                    </div>
                </pagination-template>
            </div>
        </div>
        <!-- END tables-->
        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
