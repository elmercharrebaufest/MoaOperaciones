<div class="content-wraper">
    <!-- CONTENT-->

    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 "><strong>Dato Fiscal: Vendedores</strong> </div>
            <div class="col-xs-12 col-sm-2" style="display: flex; justify-content: flex-end;">
                <!-- Button trigger modal -->
                <button type="button" class="btn btn-custom col-xs-12 col-sm-11 btn-add" data-toggle="modal"
                    *ngIf="mostrarNuevoVendedor" id="modalToggleButton" data-target="#modalNuevoVendedor">
                    Nuevo vendedor
                </button>

                <button type="button" style="display:none" id="openModalHiddenButton"></button>
            </div>
        </div>
        <!--End Title-->
        <div class="row myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow animate">
                <div class="col-xs-12 col-md-12 search-header">
                    <title-caps>Refinar resultados</title-caps>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6">
                    Por Vendedor:
                    <div class="styled-select">
                        <input type="search" class="" placeholder="" [value]="filtroVendedor"
                            (input)="filtroVendedor = $event.target.value" aria-controls="tableModal">
                    </div>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6">
                    Por Nro. Vendedor:
                    <div class="styled-select">
                        <input type="search" class="" placeholder="" [value]="filtroNroVendedor"
                            (input)="filtroNroVendedor = $event.target.value" aria-controls="tableModal">
                    </div>
                </div>
            </div>
        </div>

        <div class="row myRow">
            <div class="clearfix myTables">

                <mensaje></mensaje>
                <spinner></spinner>

                <table *ngIf="isVisible()" id="tableModal"
                    class="display nowrap dataTable no-footer dtr-inline rounded shadow animate " cellspacing="0"
                    role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('descVendedor')">
                                Vendedor
                                <div>
                                    <span>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-up': true, 'arrow': true, 'unselected': orderedByColumn === 'descVendedor' && orderDirection > 0 }"></i>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-down': true, 'arrow': true, 'unselected': orderedByColumn === 'descVendedor' && orderDirection < 0 }"></i>
                                    </span>
                                </div>
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('idVendedor')">
                                Nro. Vendedor
                                <div>
                                    <span>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-up': true, 'arrow': true, 'unselected': orderedByColumn === 'idVendedor' && orderDirection > 0 }"></i>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-down': true, 'arrow': true, 'unselected': orderedByColumn === 'idVendedor' && orderDirection < 0 }"></i>
                                    </span>
                                </div>
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('estado')">
                                Estado Interno
                                <div>
                                    <span>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-up': true, 'arrow': true, 'unselected': orderedByColumn === 'estado' && orderDirection > 0 }"></i>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-down': true, 'arrow': true, 'unselected': orderedByColumn === 'estado' && orderDirection < 0 }"></i>
                                    </span>
                                </div>
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('estadoMoa')">
                                Estado
                                <div>
                                    <span>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-up': true, 'arrow': true, 'unselected': orderedByColumn === 'estadoMoa' && orderDirection > 0 }"></i>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-arrow-down': true, 'arrow': true, 'unselected': orderedByColumn === 'estadoMoa' && orderDirection < 0 }"></i>
                                    </span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let vendedor of data | orderedColumn : {property: orderedByColumn, direction: orderDirection}  | customFilter : 'descVendedor' : filtroVendedor | customFilter : 'idVendedor' : filtroNroVendedor | paginate: { itemsPerPage:itemsPerPage, currentPage: p } ; let odd = odd"
                            role="row" [class.odd]="!odd">
                            <td>
                                <a *ngIf="isCorredor()" class="animate"
                                    (click)="goToSeccionParamDos('/dato-fiscal/situacion-fiscal', vendedor.idVendedor, vendedor.descVendedor)"
                                    href="#">{{vendedor.descVendedor}}</a>
                                <label *ngIf="!isCorredor()">{{vendedor.descVendedor}}</label>
                            </td>
                            <td>{{vendedor.idVendedor}}</td>
                            <td>{{vendedor.estado}}</td>
                            <td>{{vendedor.estadoMoa}}</td>
                        </tr>
                    </tbody>
                </table>

                <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="isVisible()">
                    <div class="dataTables_paginate paging_simple_numbers">
                        <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()"
                            [class.disabled]="pT.isFirstPage()"> Anterior </a>
                        <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
                            <a class="paginate_button" (click)="pT.setCurrent(page.value)"
                                *ngIf="pT.getCurrent() !== page.value">{{ page.label }}</a>
                            <a class="paginate_button current" *ngIf="pT.getCurrent() === page.value">{{ page.label
                                }}</a>
                        </span>
                        <a id="tableModal_next" class="paginate_button next" (click)="pT.next()"
                            [class.disabled]="pT.isLastPage()"> Siguiente </a>
                    </div>
                </pagination-template>
            </div>
        </div>
        <!-- END tables-->
        <!-- END form-->
    </section>
    <!--End CONTENT-->
    <!-- Modal -->
    <div class="modal fade" id="modalNuevoVendedor" tabindex="-1" aria-labelledby="myModalLabel" data-backdrop="false"
        style="background-color: rgba(0, 0, 0, 0.5);">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close" onClick="abrirModal()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title" id="myModalLabel">Nuevo vendedor </h4>
                </div>
                <mensaje #mensajeModal></mensaje>
                <spinner #spinnerModal></spinner>
                <div class="modal-body mySearch">
                    <div class="content-wraper" style="margin-top:0;padding-top:0">
                        <div class="for row myRow">
                            <div class="col-xs-12 col-sm-12 col-md-12">
                                <p class="crearConsultaTitulos">CUIT<span class="requerido">*</span></p>
                                <div class="styled-select">
                                    <input type="text" class="form-control" placeholder="CUIT" mask="00-00000000-0"
                                        [(ngModel)]="nuevoVendedorCUIT" maxlength="13" />
                                </div>
                            </div>
                        </div>
                        <div class="for row myRow">
                            <div class="col-xs-12 col-sm-12 col-md-12">
                                <p class="crearConsultaTitulos">Tipo</p>
                                <div class="styled-select" style="display: flex;">
                                    <input type="radio" class="form-control" name="tipoProveedor" [value]="2"
                                        id="tipoProveedorDirecto" [(ngModel)]="tipoProveedor" />
                                    <label for="tipoProveedorDirecto">
                                        Proveedor directo granos
                                    </label>
                                </div>
                                <div class="styled-select" style="display: flex;">
                                    <input type="radio" class="form-control" name="tipoProveedor" [value]="5"
                                        id="tipoCliente" [(ngModel)]="tipoProveedor" />
                                    <label for="tipoProveedorDirecto">
                                        Cliente
                                    </label>
                                </div>
                            </div>
                        </div>

    </div>
