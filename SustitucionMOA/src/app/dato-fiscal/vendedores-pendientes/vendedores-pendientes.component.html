<div class="content-wraper">
    <!-- CONTENT-->

    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 ">Dato Fiscal: <strong>Vendedores</strong> </div>

            <div class="col-xs-12 col-sm-2" style="display: flex; justify-content: flex-end;">
                <!-- Button trigger modal -->
                <button type="button" class="btn btn-custom col-xs-12 col-sm-11 btn-add" data-toggle="modal"
                    id="modalToggleButton" data-target="#modalNuevoVendedor">
                    Nuevo vendedor
                </button>

                <button type="button" style="display:none" id="openModalHiddenButton"></button>
            </div>
        </div>
        <!--End Title-->
        <div class="row myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow animate">
                <div class="col-xs-12 col-md-12 search-header">
                    <title-caps>Refinar resultados</title-caps>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6">
                    Por CUIT:
                    <div class="styled-select">
                        <input type="search" class="" placeholder="" [(ngModel)]="cuitFiltro"
                            aria-controls="tableModal">
                    </div>
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6">

                </div>
            </div>
        </div>

        <div class="row myRow">
            <div class="clearfix myTables">

                <mensaje></mensaje>
                <spinner></spinner>

                <table *ngIf="isVisible()" id="tableModal"
                    class="display nowrap dataTable no-footer dtr-inline rounded shadow animate " cellspacing="0"
                    role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" (click)="orderColumnBy('CUIT')">CUIT</th>
                            <th tabindex="0" rowspan="1" colspan="1" (click)="orderColumnBy('RazonSocial')">
                                Razon Social</th>
                            <th tabindex="0" rowspan="1" colspan="1" (click)="orderColumnBy('Estado')">
                                Estado </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                Observaciones </th>
                            <th tabindex="0" rowspan="1" colspan="1"> Acciones </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let vendedor of data  | customFilter : 'CUIT' : cuitFiltro | orderedColumn : {property: orderedByColumn, direction: orderDirection} | paginate: { itemsPerPage:itemsPerPage, currentPage: p } ; let odd = odd"
                            role="row" [class.odd]="!odd">
                            <td>{{vendedor.CUIT}}</td>
                            <td>{{vendedor.RazonSocial}}</td>
                            <td>{{vendedor.EstadoAprobacionDescripcion}}</td>
                            <td>{{vendedor.Observaciones}}</td>
                            <td>
                                <button (click)="goToSeccionParam('/alta-empresa-granos', vendedor.Id)" *ngIf="vendedor.EstadoAprobacion != 3 && 
                                vendedor.EstadoAprobacion != 5 &&
                                vendedor.EstadoAprobacion != 6 &&
                                vendedor.EstadoAprobacion != 9 " class="btn btn-custom btn-add">
                                    Ver alta
                                </button>
                                <br>
                                <button (click)="eliminarVendedor(vendedor.Id)" *ngIf="vendedor.EstadoAprobacion == 1"
                                    class="
                                    btn btn-custom btn-remove">
                                    Eliminar
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="isVisible()">
                    <div class="dataTables_paginate paging_simple_numbers">
                        <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()"
                            [class.disabled]="pT.isFirstPage()"> Anterior </a>
                        <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
                            <a class="paginate_button" (click)="pT.setCurrent(page.value)"
                                *ngIf="pT.getCurrent() !== page.value">{{ page.label }}</a>
                            <a class="paginate_button current"
                                *ngIf="pT.getCurrent() === page.value">{{ page.label }}</a>
                        </span>
                        <a id="tableModal_next" class="paginate_button next" (click)="pT.next()"
                            [class.disabled]="pT.isLastPage()"> Siguiente </a>
                    </div>
                </pagination-template>
            </div>
        </div>
        <!-- END tables-->
        <!-- END form-->
        <!-- Modal -->
        <div class="modal fade" id="modalNuevoVendedor" tabindex="-1" aria-labelledby="myModalLabel"
            data-backdrop="false" style="background-color: rgba(0, 0, 0, 0.5);">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"
                            onClick="abrirModal()">
                            <span aria-hidden="true">&times;</span>
                        </button>
                        <h4 class="modal-title" id="myModalLabel">Nuevo vendedor </h4>
                    </div>
                    <mensaje #mensajeModal></mensaje>
                    <spinner #spinnerModal></spinner>
                    <div class="modal-body mySearch">
                        <div class="col-xs-12 col-md-12">

                            <div class="col-xs-12 col-md-1">
                                <div class="formulario-label">
                                    CUIT
                                </div>
                            </div>
                            <div class="col-xs-12 col-md-5">

                                <div class="styled-select">
                                    <input type="text" class="form-control" placeholder="CUIT" mask="00-00000000-0"
                                        [(ngModel)]="nuevoVendedorCUIT" maxlength="13" />
                                </div>
                            </div>

                            <div class="col-xs-12 col-md-6">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <div class="formulario-input">
                            <button class="btn-custom btn-add" (click)="solicitarAltaProveedor()">
                                Aceptar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>
    <!--End CONTENT-->
</div>
