<div class="row">
    <div class="col-xs-12 col-sm-12 col-md-3 col-lg-3">
        <p-dropdown [options]="usuarioFiltro" [(ngModel)]="selectUsuario" placeholder="Usuario solicitante" filter="true"></p-dropdown>
    </div>
    <div class="col-xs-12 col-sm-12 col-md-3 col-lg-3">
        <p-multiSelect [options]="estadoSolpItem" [(ngModel)]="selectEstadoSolp" defaultLabel="Estado SOLP"></p-multiSelect>
    </div>
    <div class="col-xs-12 col-sm-12 col-md-3 col-lg-3">
        <p-multiSelect [options]="grupoComprasFiltro" [(ngModel)]="selectGrupoCompras" defaultLabel="Grupo de Compras"></p-multiSelect>
    </div>
    <div class="col-xs-12 col-sm-12 col-md-3 col-lg-3" style="padding-right: 30px;">
        <p-multiSelect [options]="centroFiltro" [(ngModel)]="selectCentro" defaultLabel="Centro"></p-multiSelect>
    </div>
    <div class="row myRow">
        <div class="form-group col-md-3">
            <input class="col-xs-12 col-sm-12 col-md-12 col-lg-12" pInputText type="text"
                   [(ngModel)]="nroSolp" placeholder="Buscar por numero de solp">
        </div>
        <div class="form-group col-md-3" style="text-align: center;">
            <button class="btn buscar" (click)="onBuscar()">Buscar</button>
        </div>
    </div>
</div>
