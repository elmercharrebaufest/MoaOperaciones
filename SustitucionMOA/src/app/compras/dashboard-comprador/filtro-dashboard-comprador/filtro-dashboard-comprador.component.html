

<form id="filtroForm" [formGroup]="getFiltroForm()">
  <spinner></spinner>
  <div class="row">   
    <div class="form-group col-md-6"></div>
    <div class="form-group col-md-3">
        <input class="col-xs-12 col-sm-12 col-md-12 col-lg-12" formControlName="nroSolp" pInputText type="text"
            [(ngModel)]="nroSolp" placeholder="Buscar por numero de solp">    
    </div>   
    <div class="form-group col-md-3">
      <button class="btn buscar" (click)="onBuscar()">Buscar</button>
    </div>
  </div>


</form>
