<!-- Row grupo de compras -->
<div class="row">
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 margenInput">
        <div *ngIf="mostrarCamposTipoSolp('selectGrupoCompras')" class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
            <div class="margenInput">
                Grupo de compras 
                <p-autoComplete [(ngModel)]="model.posicionActual.selectGrupoCompras" [suggestions]="grupoCompras" dataKey="Id" ariaLabel="CodigoDescripcion" field="CodigoDescripcion" appendTo="body" [autoHighlight]="true" emptyMessage="Ningún grupo de compras encontrado"
                    [minLength]="1" placeholder="Seleccionar" [dropdown]="true" [forceSelection]="true" (completeMethod)="buscarCombo($event, 'GRUPO COMPRAS')" (onFocus)=" $event.target.select()">
                </p-autoComplete>
                <div *ngIf="mostrarValidacion('selectGrupoCompras', model.posicionActual.selectGrupoCompras)">
                    <p class="text-danger">campo obligatorio</p>
                </div>
            </div>
        </div>

        <div *ngIf="mostrarCamposTipoSolp('selectSolicitanteCompras')" class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
            <div class="margenInput">
                Solicitante *
                <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.selectSolicitanteCompras" id="selectSolicitanteCompras" placeholder="Ingrese solicitante"
                    rows="1" />
                <div *ngIf="mostrarValidacion('selectSolicitanteCompras', model.posicionActual.selectSolicitanteCompras)">
                    <p class="text-danger">campo obligatorio</p>
                </div>
            </div>
        </div>

        <div *ngIf="mostrarCamposTipoSolp('necesidadCompras')" class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
            <div class="margenInput">
                N° Necesidad
                <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.necesidadCompras" id="necesidadCompras" placeholder="Ingrese Nro de necesidad" rows="1" />
                <div *ngIf="mostrarValidacion('necesidadCompras', model.posicionActual.necesidadCompras)">
                    <p class="text-danger">campo obligatorio</p>
                </div>
            </div>
           
        </div>

        <div *ngIf="mostrarCamposTipoSolp('selectArticuloCompras')" class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
            <div class="margenInput">
                Grupo de art&iacute;culo * 
                <p-autoComplete [(ngModel)]="model.posicionActual.selectArticuloCompras" [suggestions]="articuloCompras" dataKey="Id" ariaLabel="CodigoDescripcion" field="CodigoDescripcion" appendTo="body" [autoHighlight]="true"
                    emptyMessage="Ningún articulo de compras encontrado" [minLength]="1" placeholder="Seleccionar" [dropdown]="true" [forceSelection]="true" (completeMethod)="buscarCombo($event, 'ARTICULO COMPRAS')" (onFocus)=" $event.target.select()">
                </p-autoComplete>
                <div *ngIf="mostrarValidacion('selectArticuloCompras', model.posicionActual.selectArticuloCompras)">
                    <p class="text-danger">campo obligatorio</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 margenInput">
        <div *ngIf="mostrarCamposTipoSolp('textoSuministro')" class="col-xs-12 col-sm-6 col-md-6 col-lg-6 margenInput">
            <div class="margenInput">
                Texto de suministro
                <textarea [(ngModel)]="model.posicionActual.textoSuministro" id="observaciones" placeholder="Ingrese texto de suministro" cols="30" rows="5"></textarea>
                <div *ngIf="mostrarValidacion('textoSuministro', model.posicionActual.textoSuministro)">
                    <p class="text-danger">campo obligatorio</p>
                </div>
            </div>
        </div>
    

        <div *ngIf="mostrarCamposTipoSolp('motivo')" class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
            <div class="margenInput">
                Motivo
                <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" placeholder="Ingrese motivo" [(ngModel)]="model.posicionActual.motivo" id="motivo" rows="1" />
            </div>
            <div *ngIf="mostrarValidacion('motivo', model.posicionActual.motivo)">
                <p class="text-danger">campo obligatorio</p>
            </div>
        </div>

        <div *ngIf="mostrarCamposTipoSolp('modelo')" class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
            <div class="margenInput">
                Modelo
                <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" placeholder="Ingrese modelo" [(ngModel)]="model.posicionActual.modelo" id="modelo" rows="1" />
            </div>
            <div *ngIf="mostrarValidacion('modelo', model.posicionActual.modelo)">
                <p class="text-danger">campo obligatorio</p>
            </div>
        </div>
    </div>

</div> 
<!-- End Row grupo de compras -->
