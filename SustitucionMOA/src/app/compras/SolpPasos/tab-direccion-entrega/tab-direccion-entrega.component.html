<div class="row">
  <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">

    <div class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
      <div class="margenInput">
          Nombre
          <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.nombreEntrega" id="nombreEntrega" placeholder="Ingrese nombre" maxlength="40" rows="1" />
          <div *ngIf="mostrarValidacion('nombreEntrega', model.posicionActual.nombreEntrega)">
            <p class="text-danger">campo obligatorio</p>
        </div>
      </div>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput">
      <div class="margenInput">
        Calle *
        <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.calleEntrega" id="calleEntrega" placeholder="Ingrese la calle" rows="1" />
        <div *ngIf="mostrarValidacion('calleEntrega', model.posicionActual.calleEntrega)">
          <p class="text-danger">campo obligatorio</p>
      </div>
    </div>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-2 col-lg-2 margenInput">
      <div class="margenInput">
        N&uacute;mero *
        <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.numeroEntrega" id="numeroEntrega" placeholder="" rows="1" />
        <div *ngIf="mostrarValidacion('numeroEntrega', model.posicionActual.numeroEntrega)">
          <p class="text-danger">campo obligatorio</p>
        </div>
      </div>
    </div>  


    <div class="col-xs-12 col-sm-6 col-md-2 col-lg-2 margenInput">
      <div class="margenInput">
        C&oacute;digo postal
        <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.codigoPostalEntrega" id="codigoPostalEntrega" placeholder="Ingrese codigo postal"
            maxlength="40" rows="1" />
          <div *ngIf="mostrarValidacion('codigoPostalEntrega', model.posicionActual.codigoPostalEntrega)">
            <p class="text-danger">campo obligatorio</p>
        </div>
      </div>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-2 col-lg-2 margenInput">
      <div class="margenInput">
        Pa&iacute;s
        <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg" [(ngModel)]="model.posicionActual.paisEntrega" id="paisEntrega" placeholder="Ingrese la calle" rows="1" />
    </div>
    </div>
  </div>
</div>
