<div class="content-wraper alinearAlturaMenu">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 "> <strong>¿Qu&eacute; tipo de SOLP quiere iniciar?</strong></div>
        </div>
        <!--End Title-->
        <!-- Form-->
        <div class="row myRow firstSection">
            <div class="rounded shadow">
                <stepper [(pasos)]="pasos" (change)="cambioPaso($event)" [(paso)]="pasoActual"></stepper>
            </div>
        </div>
        <spinner></spinner>
        <p-toast [style]="{marginTop: '105px'}"></p-toast>
        <div class="row myRow mySearch" style="margin-bottom: 4em;">
            <div class="col-xs-12 col-md-12 rounded shadow animate">
                <div class="col-xs-12 col-md-12 headerCompras" #headerCompras>
                    <strong>Paso {{pasoActual.Numero}}:</strong> {{pasoActual.Nombre}}
                </div>
                <hr class="prototipo">
                <!-- contenido -->
                <div class="col-xs-12 col-md-12" [ngSwitch]="pasoActual.Codigo">
                    <div *ngSwitchCase="enumSolp.PliegoGeneracion1" [@fadeInOut] >
                        <generacion1 #paso1 [(model)]="solpActual" [(locale)]="es" (onEstCompleto)="actualizarEstadoSolp($event)"></generacion1>
                    </div>
                    <div  *ngSwitchCase="enumSolp.PliegoGeneracion2" [@fadeInOut] >
                        <generacion2 #paso2 [(model)]="solpActual" [(locale)]="es" (onEstCompleto)="actualizarEstadoSolp($event)"></generacion2>
                    </div>
                    <div  *ngSwitchCase="enumSolp.PliegoEspecificacion" [@fadeInOut] >
                        <especificaciones #paso3 [(model)]="solpActual" [(locale)]="es" (onEstCompleto)="actualizarEstadoSolp($event)"></especificaciones>
                    </div>
                    <div  *ngSwitchCase="enumSolp.PliegoCotizacion" [@fadeInOut] >
                        <cotizacion [(model)]="solpActual" [(locale)]="es" (onEstCompleto)="actualizarEstadoSolp($event)"></cotizacion>
                    </div>
                    <div  *ngSwitchCase="enumSolp.SolpCabecera" [@fadeInOut] >
                        <cabecera #cabecera [(model)]="solpActual" [(locale)]="es" [(combos)]="combos" ></cabecera>
                    </div>
                    <div  *ngSwitchCase="enumSolp.SolpSubposiciones" [@fadeInOut] >
                        <subPosicion [(model)]="solpActual" [(locale)]="es" [(combos)]="combos" ></subPosicion>
                    </div>
                    
                    <div *ngSwitchDefault [@fadeInOut] >
                        Paso en construccion
                    </div>
                </div>                
            </div>
        </div>
        <p-sidebar visible="true" position="bottom" [modal]="false" [showCloseIcon]="false" dismissible="false" appendTo="body">
            <div class="row" >
                <div class="col-xs-2"></div>
                <div class="col-xs-3" style="margin-left: 3em;">
                    <button class="btn btn-danger" (click)="cancelarSolp()"><i class="fa fa-reply"></i>&nbsp; CANCELAR</button>
                </div>
                <div class="col-xs-6">
                    
                 
                    <button class="btn btn-defaut btn-secondary botonesCompras" (click)="navegar(pasoAnterior())"><i class="fa fa-arrow-left"></i>&nbsp; {{pasoAnterior().descripcion}}</button>&nbsp;
                    <button class="btn btn-primary botonesComprasColor" (click)="guardarCambios()" >GUARDAR</button>&nbsp;
                    <button class="btn btn-primary botonesComprasColor" *ngIf="pasoActual.Preview">PREVIEW</button>&nbsp;

                    <!-- <asp: Button ID = "btn_PDFEmail"  runat = "server"  Text = "Convertir HTML a PDF y enviar correo electrónico con un archivo adjunto"  OnClick = "btn_PDFEmail_Click"  />  -->

                    <button class="btn btn-defaut btn-secondary botonesCompras" *ngIf="pasoSiguiente().paso" (click)="navegar(pasoSiguiente())">{{pasoSiguiente().descripcion}} &nbsp;<i class="fa fa-arrow-right"></i></button>
                    <button class="btn btn-success botonesComprasColor" *ngIf="!pasoSiguiente().paso" (click)="finalizar()" >{{pasoSiguiente().descripcion}}</button>
                    <button class="btn btn-secondary botonAgregarPosicion botonesCompras" *ngIf="pasoActual.Codigo == 'SolpCabecera'" (click)="agregarPosicion(headerCompras)" ><i class="fa fa-plus"></i>&nbsp; Agregar posicion</button>
                    <button class="btn btn-secondary botonAgregarPosicion" *ngIf="pasoActual.Codigo == enumSolp.SolpSubposiciones" (click)="navegar(pasoAnterior())" ><i class="fa fa-plus"></i>&nbsp; Agregar posicion</button>
                </div>
            </div>
        </p-sidebar>
        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
<p-dialog header="Previsualización" 
        [(visible)]="mostrarPreview" 
        [width]="800" 
        draggable="false"
        blockScroll="true"
        modal="modal"
        appendTo="body">
    <pliego-preview [(model)]="solpActual"></pliego-preview>
</p-dialog>

<!-- Modal cancelar SOLP-->
<p-confirmDialog #dialogo key="cancelarSolp" header="Cancelar SOLP" icon="pi pi-exclamation-triangle" [width]="400" [responsive]="true" appendTo="body" >
    <p-footer>
        <button type="button" pButton  label="Cancelar" class="ui-button-info" (click)="dialogo.reject()"></button>
        <button type="button" pButton  label="Aceptar" class="ui-button-success" (click)="dialogo.accept()"></button>
    </p-footer>
</p-confirmDialog>
<!--fin modal cancelar SOLP-->
