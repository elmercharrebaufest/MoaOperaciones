<style>
    .btn-secondary {
        background-color: #fff; 
        border: 1px solid #5B5B5B;
    }
    .btn-secondary:hover {
        background-color: #5B5B5B; 
        color: #fff;
    }
</style>
<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 "> <strong>¿Que tipo de SOLP quiere iniciar?</strong></div>
        </div>
        <!--End Title-->
        <!-- Form-->
        <div class="row myRow firstSection">
            <div class="rounded shadow">
                <stepper [(pasos)]="pasos" (change)="cambioPaso($event)"></stepper>
            </div>
        </div>

        <div class="row myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow animate">
                <div class="col-xs-12 col-md-12 headerCompras">
                    <strong>Paso {{pasoActual.Numero}}:</strong> {{pasoActual.Nombre}}
                </div>
                <hr>
                <!-- contenido -->
                <!--Paso 1-->
                <div class="col-xs-12 col-md-12">
                    <div *ngIf="pasoActual.Codigo == 'PliegoGeneracion1'" >
                        <generacion1 [(model)]="solpActual"></generacion1>
                    </div>
                </div>
                <!--Paso 2-->
                <div class="col-xs-12 col-md-12">
                    <div *ngIf="pasoActual.Codigo == 'PliegoGeneracion2'" >
                        <generacion2 [(model)]="solpActual"></generacion2>
                    </div>
                </div>
                
            </div>
        </div>
        <div class="row myRow" >
            <div class="col-xs-4">
                <button class="btn btn-danger" >CANCELAR</button>
            </div>
            <div class="col-xs-6">
                <button class="btn btn-defaut btn-secondary" >{{pasoAnterior().descripcion}}</button>&nbsp;
                <button class="btn btn-primary" >GUARDAR</button>&nbsp;
                <button class="btn btn-primary" >PREVIEW</button>&nbsp;
                <button class="btn btn-defaut btn-secondary" *ngIf="pasoSiguiente().paso" >{{pasoSiguiente().descripcion}}</button>
                <button class="btn btn-success" *ngIf="!pasoSiguiente().paso" >{{pasoSiguiente().descripcion}}</button>
            </div>
        </div>
        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
