<div class="container-fluid">
    <!-- CONTENT-->
    <!-- Contiene todo -->
    <section class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <mensaje></mensaje>
        <div class="inputCompras">
            <div class="row myRow" style="padding-top: 2px;">

                <div class="row myRow" >
                    
                    <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.visitaDeObra" label="Visita de obra" binary="true"></p-checkbox>
                        </div>


                        <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                            <p-checkbox [(ngModel)]="model.visitaDeObraMasiva" label="Visita de obra masiva" binary="true"></p-checkbox>
                        </div>

                        <div *ngFor="let visita of model.listaVisitas">
                            <div class="col-xs-12 col-sm-12 col-md-7 margenInput">
                                <div class="styled-select">
                                    <p-calendar [style]="{'width': '75%'}" [(ngModel)]="visita.visitaDeObraFecha" [locale]="locale" [showIcon]="true" dateFormat="yy-mm-dd" appendTo="body" [disabled]="!model.visitaDeObraMasiva"  [readonlyInput]="true" [minDate]="hoy"></p-calendar>    
                                </div>
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-4 prime-hora margenInput">
                                <div>
                                    <p-calendar class="styled-select" [(ngModel)]="visita.visitaDeObraHora" [locale]="locale" [showIcon]="true" icon="fa fa-clock-o" [disabled]="!model.visitaDeObraMasiva"  [timeOnly]="true"></p-calendar>
                                </div>
                            </div>
                            <div class="col-xs-12 col-sm-12 col-md-1">
                                <span  (click)="model.visitaDeObraMasiva ? eliminarVisita(visita.id) : null"><img [class.pointer]="model.visitaDeObraMasiva" src="./Content/images/icons/trash.svg" alt="trash" style="padding: 8px;" /></span>
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <div>
                                <span (click)="model.visitaDeObraMasiva ? agregarNuevaVisita() : null" [class.pointer]="model.visitaDeObraMasiva" class="enlaceVisita" ><i class="fa fa-plus-square"></i>&nbsp; Agregar nueva visita de obra</span>
                            </div>
                        </div>

                    </div>



                    <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            Supervisor sector *
                            <div class="styled-select widthCompras">
                                <input type="text" placeholder="Ingrese supervisor de sector" [(ngModel)]="model.supervisorSector" maxlength="100">
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            Supervisor de trabajo *
                            <div class="styled-select widthCompras">
                                <input type="text" placeholder="Ingrese supervisor de trabajo" [(ngModel)]="model.supervisorTrabajo" maxlength="100">
                            </div>
                        </div>

                    </div>

                </div>


                <div class="row myRow margenInput" style="padding-top: 2px;">

                    <div  class="col-xs-12 col-sm-6 col-md-6 col-lg-6">


                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.obradores" label="Obradores" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.modoElevacion" label="Modo de elevacion o andamios" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.tecnicoSeguridad" label="Técnico de seguridad" binary="true"></p-checkbox>
                        </div> 

                    </div>

                    <div  class="col-xs-12 col-sm-6 col-md-6 col-lg-6">


                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.descripcionTecnica" label="Descripción tecnica del trabajo" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.entregaDocumentacion" label="Entrega de documentación técnica" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 inputRight margenInput">
                            <div class="col-xs-12 col-sm-12 col-md-12 ">
                                Fecha limite de consulta
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-8">
                                <div class="styled-select">
                                    <p-calendar [style]="{'width': '75%'}" [(ngModel)]="model.fechaLimiteFecha" [locale]="locale" [showIcon]="true" dateFormat="yy-mm-dd" appendTo="body" [readonlyInput]="true" [minDate]="hoy"></p-calendar>
                                </div>
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-4 prime-hora">
                                <p-calendar class="styled-select" [(ngModel)]="model.fechaLimiteHora" [locale]="locale" [showIcon]="true" icon="fa fa-clock-o" [timeOnly]="true"></p-calendar>    
                            </div>
                        </div>
                    </div>

                </div>

                <div class="row myRow">
                    <div class="col-xs-12 col-sm-12 col-md-12">
                       
                        <label class="labelCompras" for="editorTexto"> Observaciones:</label>

                        <quill-editor appDragAndDrop id="observaciones" [(ngModel)]="model.observaciones"  [styles]="{'height':'160px'}"
                        (onFileDropped)="fileChange($event)" (onSelectionChanged)="selectionChange($event)" placeholder="">

                           <div quill-editor-toolbar>
                               <span class="ql-formats">
                                   <select class="ql-size">
                                       <option value="small"></option>
                                       <option selected></option>
                                       <option value="large"></option>
                                       <option value="huge"></option>
                                   </select>
                               </span>

                               <span class="ql-formats">
                                   <button class="ql-bold" aria-label="bold"></button>
                                   <button class="ql-italic" aria-label="italic"></button>
                                   <button class="ql-underline" aria-label="underline"></button>
                                   <button class="ql-strike" aria-label="strike"></button>
                               </span>

                               <span class="ql-formats">
                                   <button class="ql-list" value="ordered"></button>
                                   <button class="ql-list" value="bullet"></button>
                                   <button class="ql-indent" value="-1"></button>
                                   <button class="ql-indent" value="+1"></button>
                               </span>


                               <span class="ql-formats">
                                   <select class="ql-align">
                                       <option selected></option>
                                       <option value="center"></option>
                                       <option value="right"></option>
                                       <option value="justify"></option>
                                   </select>
                               </span>
                               <span class="ql-formats">
                                   <button aria-label="Borra estilos" class="ql-clean" type="button"></button>
                                   <button aria-label="Adjuntar imagen" class="ql-image" type="button"></button>
                               </span>
                           </div>

                       </quill-editor>
                    </div>
                </div>
            </div>
        </div>
        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
