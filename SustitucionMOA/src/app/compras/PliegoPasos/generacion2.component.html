<div class="container">
    <!-- CONTENT-->
    <!-- Contiene todo -->
    <section class="col-xs-12 col-sm-12 col-md-12">
        <mensaje></mensaje>
        <div class="inputCompras">
            <div class="row myRow margenNeg">


                <div class="row myRow" style="padding-top: 2px;">
                    
                    <div class="col-xs-12 col-sm-6 col-md-6">

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.visitaDeObra" label="Visita de obra" binary="true"></p-checkbox>
                        </div>

                       
                        <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                            <p-checkbox [(ngModel)]="model.visitaDeObraMasiva" label="Visita de obra masiva" binary="true"></p-checkbox>
                        </div>
                     
                        <div *ngFor="let visita of listaVisitas">
                            <div class="col-xs-12 col-sm-12 col-md-7 margenInput">
                                <div class="styled-select" *ngIf="model.visitaDeObraMasiva">
                                    <p-calendar [(ngModel)]="visita.visitaDeObraFecha"  [showIcon]="true" dateFormat="yy-mm-dd" appendTo="body" [readonlyInput]="true"></p-calendar>    
                                </div>
                            </div>
                            
                            <div class="col-xs-12 col-sm-12 col-md-4 prime-hora margenInput">
                                <div *ngIf="model.visitaDeObraMasiva" >
                                    <p-calendar class="styled-select" [(ngModel)]="visita.visitaDeObraHora" [showIcon]="true" icon="fa fa-clock-o" [timeOnly]="true"></p-calendar>
                                </div>
                            </div>
                            <div class="col-xs-12 col-sm-12 col-md-1">
                                <span (click)="eliminarVisita(visita.id)" *ngIf="model.visitaDeObraMasiva"><i class="fa fa-trash"></i></span>
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput" *ngIf="model.visitaDeObraMasiva">
                            <div>
                                <span (click)="agregarNuevaVisita()" class="enlaceVisita" ><i class="fa fa-plus">&nbsp; Agregar nueva visita de obra</i></span>
                            </div>
                        </div>

                    </div>
                        


                    <div class="col-xs-12 col-sm-6 col-md-6">

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            Supervisor sector *
                            <div class="styled-select">
                                <input type="text" class="" placeholder="" [(ngModel)]="model.supervisorSector" maxlength="100">
                            </div>
                        </div>
                
                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            Supervisor de trabajo *
                            <div class="styled-select">
                                <input type="text" class="" placeholder="" [(ngModel)]="model.supervisorTrabajo" maxlength="100">
                            </div>
                        </div>
                    
                    </div>
                
                </div>


                <div class="row myRow margenInput" style="padding-top: 2px;">

                    <div  class="col-xs-12 col-sm-6 col-md-6">


                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.obradores" label="Obradores" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.modoElevacion" label="Modo de elevacion o andamios" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.tecnicoSeguridad" label="Técnico de seguridad" binary="true"></p-checkbox>
                        </div> 

                    </div>

                    <div  class="col-xs-12 col-sm-6 col-md-6">


                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.descripcionTecnica" label="Descripción tecnica del trabajo" binary="true"></p-checkbox>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            <p-checkbox [(ngModel)]="model.entregaDocumentacion" label="Entrega de documentación técnica" binary="true"></p-checkbox>
                        </div>


                        <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                            Fecha limite de consulta *
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-7 margenInput">
                            <div class="styled-select">
                                <p-calendar [(ngModel)]="model.fechaLimiteFecha" [showIcon]="true" dateFormat="yy-mm-dd" appendTo="body" [readonlyInput]="true"></p-calendar>
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-4 prime-hora margenInput">
                            <p-calendar class="styled-select" [(ngModel)]="model.fechaLimiteHora" [showIcon]="true" icon="fa fa-clock-o" [timeOnly]="true"></p-calendar>    
                        </div>

                    </div>

                </div>


            </div>   
            
            

        </div>


        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
