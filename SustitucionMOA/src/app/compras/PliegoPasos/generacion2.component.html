<div class="row myRow">
    <!-- CONTENT-->
    <section class="col-xs-12 col-md-12">
        <mensaje></mensaje>
        <div class="inputCompras">
            <div class="margenNeg">
                <div class="row myRow">
                    <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                        <input type="checkbox" style="margin-right: 5px;" id="visitaDeObra" placeholder=""
                            [disabled]="visitaDeObra" [(ngModel)]="model.visitaDeObra">
                        <label for="visitaDeObra">Visita de obra</label>
                    </div>
            
                    <div class="col-xs-12 col-sm-6 col-md-6">
                        Supervisor sector *
                        <div class="styled-select">
                            <input type="text" class="" placeholder="" [(ngModel)]="supervisorSector" maxlength="100">
                        </div>
                    </div>
                </div>    

                    
                <div class="row myRow">
                    <div class="col-xs-12 col-sm-6 col-md-12">
                        Visita de obra masiva *
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-4">
                        <div class="styled-select">
                            <div class="input-group date form_datetime" [(ngModel)]="model.fechaEntrega" data-provide="datepicker" data-date="" data-date-format="yyyy-MM-dd" data-link-field="dtp_fecha_pago">
                                <input type="text" id="noCursor" fechaInicioInput readonly />
                                <span class="input-group-addon"><span class="fa fa-calendar"></span></span>
                            </div>
                            <input #dtp_fecha_pago id="dtp_fecha_pago" class="dtp_fecha_pago" value={{fechaEntrega}} style="visibility: hidden; display: none"  required />
                        </div>
                    </div>

                    <div class="col-xs-12 col-md-2">
                        <div class="formulario-label">
                            <div class="styled-select input-group">
                                <select [(ngModel)]="model.horaEntrega">
                                    <option value="{{i}}" *ngFor="let item of [].constructor(23); let i = index">{{i | number: '2.0-0'}}:
                                    00
                                    </option>
                                </select>
                                <span class="input-group-addon"><span class="fa fa-clock-o "></span></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-6 col-md-6">
                        Supervisor de trabajo *
                        <div class="styled-select">
                            <input type="text" class="" placeholder="" [(ngModel)]="supervisorTrabajo" maxlength="100">
                        </div>
                    </div>
                </div>

                <div class="row myRow">
                    <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                        <input type="checkbox" style="margin-right: 5px;" id="visitaDeObra" placeholder=""
                            [disabled]="visitaDeObra" [(ngModel)]="model.visitaDeObra">
                        <label for="visitaDeObra">Obradores</label>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                        <input type="checkbox" style="margin-right: 5px;" id="visitaDeObra" placeholder=""
                            [disabled]="visitaDeObra" [(ngModel)]="model.visitaDeObra">
                        <label for="visitaDeObra">Descripcion tecnica del trabajo</label>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                        <input type="checkbox" style="margin-right: 5px;" id="visitaDeObra" placeholder=""
                            [disabled]="visitaDeObra" [(ngModel)]="model.visitaDeObra">
                        <label for="visitaDeObra">Modo de elevacion o andamios</label>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                        <input type="checkbox" style="margin-right: 5px;" id="visitaDeObra" placeholder=""
                            [disabled]="visitaDeObra" [(ngModel)]="model.visitaDeObra">
                        <label for="visitaDeObra">Entrega de documentacion tecnica</label>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                        <input type="checkbox" style="margin-right: 5px;" id="visitaDeObra" placeholder=""
                            [disabled]="visitaDeObra" [(ngModel)]="model.visitaDeObra">
                        <label for="visitaDeObra">Tecnico de seguridad</label>
                    </div>
                    
                </div>

                <div class="row myRow">
                    <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                        Fecha limite de consulta *
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-4">
                        <div class="styled-select">
                            <div class="input-group date form_datetime" [(ngModel)]="model.fechaEntrega" data-provide="datepicker" data-date="" data-date-format="yyyy-MM-dd" data-link-field="dtp_fecha_pago">
                                <input type="text" id="noCursor" fechaInicioInput readonly />
                                <span class="input-group-addon"><span class="fa fa-calendar"></span></span>
                            </div>
                            <input #dtp_fecha_pago id="dtp_fecha_pago" class="dtp_fecha_pago"  value={{fechaEntrega}} style="visibility: hidden; display: none"  required />
                        </div>
                    </div>

                    <div class="col-xs-12 col-md-2">
                        <div class="formulario-label">
                            <div class="styled-select input-group">
                                <select [(ngModel)]="model.horaEntrega">
                                    <option value="{{i}}" *ngFor="let item of [].constructor(23); let i = index">{{i | number: '2.0-0'}}:
                                    00
                                    </option>
                                </select>
                                <span class="input-group-addon"><span class="fa fa-clock-o "></span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
