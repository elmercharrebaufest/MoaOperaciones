<!-- Form-->
<div class="container clearfix">
    <div class="col-md-12 col-xs-12 col-sm-12">
        <div class="inputCompras">
            <div class="row myRow">
                <div class="col-xs-12 col-sm-5 col-md-5 col-lg-3">
                    Nombre de obra *
                </div>
                <div class="col-xs-12 col-sm-5 col-md-5 col-lg-4">
                    Fecha tentativa de entrega de ofertas *
                </div>
            </div>
            <div class="row myRow margenInput" style="padding-top: 2px;">
                <div class="col-xs-12 col-sm-5 col-md-5 col-lg-3">
                    <div class="styled-select">
                        <input pInputText type="text" [(ngModel)]="model.nombreDeObra" class="fourRounded" placeholder="Ingrese nombre de obra" aria-controls="tableModal">
                    </div>
                </div>            
                <div class="col-xs-12 col-sm-4 col-md-4 col-lg-3 margenInput">
                    <div class="styled-select">
                        <p-calendar [(ngModel)]="model.fechaEntrega" [showIcon]="true" dateFormat="yy-mm-dd" appendTo="body" [readonlyInput]="true"></p-calendar>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-2 col-md-2 prime-hora col-lg-2 prime-hora margenInput">
                    <p-calendar class="styled-select" [(ngModel)]="model.horaEntrega" [showIcon]="true" icon="fa fa-clock-o" [timeOnly]="true" ></p-calendar>         
                </div>
            </div>
            <div class="row myRow margenInput">
                <div class="col-xs-12  col-sm-5 col-md-5 col-lg-3">
                    Fiscal contrato *
                    <div class="styled-select ">
                        <!-- Va a ser un select a futuro -->
                        <input type="search" [(ngModel)]="model.fiscalContrato" class="fourRounded" placeholder="Ingrese nombre de fiscal" aria-controls="tableModal">
                    </div>
                </div>
                <div class="col-xs-12 col-sm-5 col-md-5 col-lg-3">
                    Tel&eacute;fono
                    <div class="styled-select ">
                        <input type="search" [(ngModel)]="model.telefono" class="fourRounded" placeholder="Ingrese numero de telefono" aria-controls="tableModal">
                    </div>
                </div>
            </div>
            <div class="row myRow margenInput">
                <div class="col-xs-12 col-sm-5 col-md-5 col-lg-3">
                    Mail *
                    <div class="styled-select">
                        <input type="search" [(ngModel)]="model.mail" class="fourRounded" placeholder="" aria-controls="tableModal">
                    </div>    
                </div>
            </div>
            <div class="margenInput obligatorio">
                * Campos obligatorios
            </div>
        </div>
    </div>
</div>
