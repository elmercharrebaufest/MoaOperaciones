<!-- Form-->
<div class="container-fluid">
    <!-- CONTENT-->
    <!-- Contiene todo -->
    <section class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <mensaje></mensaje>
            <div class="inputCompras">
                <div class="row myRow" style="padding-top: 2px;">

                    <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">

                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 margenInput">
                            Nombre de obra *
                            <div class="styled-select">
                                <input pInputText type="text" [(ngModel)]="model.nombreDeObra" class="fourRounded" placeholder="Ingrese nombre de obra" aria-controls="tableModal">
                            </div>
                        </div> 

                        <div class="col-xs-12  col-sm-12 col-md-12 col-lg-12 margenInput">
                            Fiscal contrato *
                            <div class="styled-select ">
                                <!-- Va a ser un select a futuro -->
                                <input type="search" [(ngModel)]="model.fiscalContrato" class="fourRounded" placeholder="Ingrese nombre de fiscal" aria-controls="tableModal">
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 margenInput">
                            Mail *
                            <div class="styled-select">
                                <input type="text"  pInputText [(ngModel)]="model.mail" class="fourRounded" placeholder="" aria-controls="tableModal">
                            </div>    
                        </div>
                    </div>   
                
                    <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 inputRight margenInput">
                            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 ">
                                Fecha tentativa de entrega de ofertas *
                            </div>
                            
                            <div class="col-xs-12 col-sm-12 col-md-8 col-lg-8 margenInput">
                                <div class="styled-select">
                                    <p-calendar [(ngModel)]="model.fechaEntrega" [locale]="locale" [style]="{'width': '75%'}" [showIcon]="true" dateFormat="yy-mm-dd" appendTo="body" [readonlyInput]="true" [minDate]="hoy"></p-calendar>
                                </div>
                            </div>
                        
                        
                            <div class="col-xs-12 col-sm-12 col-md-4 col-lg-4 prime-hora col-lg-4 prime-hora margenInput">
                                <p-calendar class="styled-select" disabled="false" [(ngModel)]="model.horaEntrega" [locale]="locale" [showIcon]="true" icon="fa fa-clock-o" [timeOnly]="true" [readonlyInput]="true"></p-calendar>         
                            </div>

                        </div>
                    

                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                            Tel&eacute;fono
                            <div class="styled-select ">
                                <input type="search" [(ngModel)]="model.telefono" class="fourRounded" placeholder="Ingrese numero de telefono" aria-controls="tableModal">
                            </div>
                        </div>
                    </div> 
                </div>
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <div class="margenInput obligatorio">
                        * Campos obligatorios
                    </div>
                </div>
            </div>   
    </section>
</div>
