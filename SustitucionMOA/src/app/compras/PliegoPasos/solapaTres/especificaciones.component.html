<form [formGroup]="formularioEspecificaciones">
    <div class="container-fluid">
        <!-- CONTENT-->
        <!-- Contiene todo -->
        <section class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <mensaje></mensaje>
            <div class="inputCompras">
                <div class="row myRow" style="padding-top: 2px;">

                    <div class="row myRow">
                        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
                            <label class="labelCompras" for="editorTexto"> Adjuntar Anexos</label>
                            <p-fileUpload name="myfile" auto="true" multiple="multiple" chooseLabel="Elegir archivo"
                                [showUploadButton]=false [showCancelButton]=false [customUpload]="true"
                                (uploadHandler)="uploadHandler($event)">
                                <ng-template *ngIf="viewModel.archivosAdjuntosNuevos.length == 0" pTemplate="toolbar">
                                    <div *ngIf="viewModel.archivosAdjuntosNuevos.length == 0"
                                        style="display: inline !important;">
                                        Ningún archivo elegido</div>
                                </ng-template>
                                <ng-template let-file pTemplate="file">

                                </ng-template>
                            </p-fileUpload>
                        </div>
                    </div>

                    <div class="row myRow"
                        *ngIf="viewModel.archivosAdjuntosNuevos.length > 0 || viewModel.archivosGuardadosEspecificaciones.length > 0">
                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                            <div>
                                <label class="labelCompras" for="editorTexto"> Anexos agregados</label>
                            </div>
                            <!--Archivos que ya fueron guardados-->
                            <div class="row col-xs-3 justify-content-start"
                                *ngFor="let archivo of viewModel.archivosGuardadosEspecificaciones">
                                <img class="pointer" src="./Content/images/icons/trashRed.svg" alt="imageAlt"
                                    (click)="eliminarAdjuntoGuardado(archivo)" style="width: 26px;" />
                                <a class="link-archivo pointer" (click)="descargarArchivo(archivo)">
                                    {{archivo.nombreArchivo}}</a>
                            </div>
                            <!--Fin Archivos que ya fueron guardados-->
                            <!--Archivos nuevos-->
                            <div class="row col-xs-3 justify-content-start"
                                *ngFor="let archivo of this.viewModel.archivosAdjuntosNuevos">
                                <img class="pointer" src="./Content/images/icons/trashRed.svg" alt="imageAlt"
                                    (click)="eliminarAdjuntoNuevo(archivo)" style="width: 26px;" />
                                <a class="link-archivo pointer" (click)="descargarArchivo(archivo)">
                                    {{archivo.name}}</a>
                            </div>
                            <!--Fin Archivos nuevos-->
                        </div>
                    </div>
<!--border: 1px solid #a80000;-->
                    <div class="row myRow">
                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                            <label class="labelCompras" for="editorTexto"> Observaciones</label>
                            <quill-editor [class.error]="mostrarError('observacion')"  formControlName="observacion" appDragAndDrop id="observaciones" [(ngModel)]="viewModel.observaciones"
                                [styles]="{'min-height':'500px','max-height':'auto'}" 
                                (onFileDropped)="fileChange($event)" (onSelectionChanged)="selectionChange($event)"
                                placeholder="" [modules]="modulesEditor" [required]="true">

                                <div quill-editor-toolbar>
                                    <span class="ql-formats">
                                        <select class="ql-size">
                                            <option value="small"></option>
                                            <option selected></option>
                                            <option value="large"></option>
                                            <option value="huge"></option>
                                        </select>
                                    </span>

                                    <span class="ql-formats">
                                        <button class="ql-bold" aria-label="bold"></button>
                                        <button class="ql-italic" aria-label="italic"></button>
                                        <button class="ql-underline" aria-label="underline"></button>
                                        <button class="ql-strike" aria-label="strike"></button>
                                    </span>

                                    <span class="ql-formats">
                                        <button class="ql-list" value="ordered"></button>
                                        <button class="ql-list" value="bullet"></button>
                                        <button class="ql-indent" value="-1"></button>
                                        <button class="ql-indent" value="+1"></button>
                                    </span>


                                    <span class="ql-formats">
                                        <select class="ql-align">
                                            <option selected></option>
                                            <option value="center"></option>
                                            <option value="right"></option>
                                            <option value="justify"></option>
                                        </select>
                                    </span>
                                    <span class="ql-formats">
                                        <button aria-label="Borra estilos" class="ql-clean" type="button"></button>
                                        <button aria-label="Adjuntar imagen" class="ql-image" type="button"></button>
                                    </span>
                                </div>

                            </quill-editor>


                            <div *ngIf="mostrarError('observacion')">
                                <p class="text-danger">campo obligatorio</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- END form-->
        </section>
        <!--End CONTENT-->
    </div>
</form>
