
<div class="container-fluid">
    <!-- CONTENT-->
    <!-- Contiene todo -->
    <section class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <mensaje></mensaje>
        <div class="inputCompras">
            <div class="row myRow" style="padding-top: 2px;">

            
                <!-- Row posiciones -->
                <div class="row">
                    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 margenInput">
                        <div class="col-xs-12 col-sm-6 col-md-1 col-lg-1 margenInput">
                           Sub Posición
                        </div> 
                        <div class="col-xs-12 col-sm-6 col-md-3 col-lg-3 margenInput" >
                            <p-dropdown [options]="model.posiciones" [(ngModel)]="model.posicionActual" dataKey="id" optionLabel="id"
                            (onFocus)="validarPosicionActual()">
                                <ng-template let-item pTemplate="selectedItem">
                                    #{{item.value.numeroPosicion + " " + (item.value.textoGenerico || " ")}}
                                    <i *ngIf="item.value.posicionValida === false" class="fa fa-exclamation" style="color:red"></i>
                                </ng-template>
                                <ng-template let-item pTemplate="item">
                                    #{{item.value.numeroPosicion + " " + (item.value.textoGenerico || " ")}}
                                    <i *ngIf="item.value.posicionValida === false" class="fa fa-exclamation" style="color:red"></i>
                                </ng-template>
                            </p-dropdown>
                        </div>
                        <div class="col-xs-12 col-sm-6 col-md-8 col-lg-8 margenInput" style="text-align: right;">
                            <button class="btn btn-danger" (click)="model.eliminarPosicion()"><img  src="./Content/images/icons/trash.svg" alt="trash"/>Importar Excel</button>
                        </div>
                    </div>
                </div>    
                <form >
                    <div class="row">
                        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12"> 
                            <p-table [value]="cars">
                                <ng-template pTemplate="header">
                                    <tr>
                                        <th>Vin</th>
                                        <th>Year</th>
                                        <th>Brand</th>
                                        <th>Color</th>
                                    </tr>
                                </ng-template>
                                <ng-template pTemplate="body" let-car>
                                    <tr>
                                        <td>{{car.vin}}</td>
                                        <td>{{car.year}}</td>
                                        <td>{{car.brand}}</td>
                                        <td>{{car.color}}</td>
                                    </tr>
                                </ng-template>
                            </p-table>
                             
                        </div>   
                    </div>
                    <!-- End Row posiciones -->
                    
                </form>
            </div>
        </div>
        <!-- END form-->    
    </section>
    <!--End CONTENT-->        
</div>
