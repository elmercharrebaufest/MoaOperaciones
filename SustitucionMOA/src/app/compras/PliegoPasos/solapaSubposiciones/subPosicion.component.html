<div class="container-fluid">
    <!-- CONTENT-->
    <!-- Contiene todo -->
    <section class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <mensaje></mensaje>
        <spinner></spinner>
        <div class="inputCompras">
            <div class="row myRow" style="padding-top: 2px;">
                <!-- Row posiciones -->
                <div class="row">
                    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 margenInput alinearTitulo">

                        <div class="col-xs-3 col-sm-3 col-md-3 col-lg-3 margenInput">
                            <p-dropdown [options]="model.posiciones" [(ngModel)]="model.posicionActual" dataKey="id" optionLabel="id" (onChange)="cambiarSubPosicion()">
                                <ng-template let-item pTemplate="selectedItem">
                                    #{{item.value.numeroPosicion + " " + (item.value.textoGenerico || " ")}}
                                    <i *ngIf="item.value.posicionValida === false" class="fa fa-exclamation" style="color:red"></i>
                                </ng-template>
                                <ng-template let-item pTemplate="item">
                                    #{{item.value.numeroPosicion + " " + (item.value.textoGenerico || " ")}}
                                    <i *ngIf="item.value.posicionValida === false" class="fa fa-exclamation" style="color:red"></i>
                                </ng-template>
                            </p-dropdown>
                        </div>
                        <div *ngIf="posicionInvalida" class="col-xs-9 col-sm-9 col-md-9 col-lg-9">
                            <div class="col-xs-9 col-sm-9 col-md-9 col-lg-9 margenInput">
                                * Posición invalida, revise el paso 5 (completar Texto Genérico y Tipo de Imputación).
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <tab-subposiciones [(model)]="model" [(combos)]="combos" [(listadoSubposiciones)]="this.listadoPosicionActul" ></tab-subposiciones>
                </div>
               
                <div class="row">
                    <div *ngIf="!posicionInvalida" style="float: right; margin-right: 2em">
                        <button class="btn marginButton buttonTotalCompras">Valor Total:
                            {{model.posicionActual.monedaSeleccionada?.Codigo}}
                            {{model.posicionActual.totalPosicion()}}</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
    <div style="color: black;">
        * Campos obligatorios
    </div>
</div>




<!-- Modal eliminacion de subposicion-->
<p-confirmDialog #dialogo header="Eliminar" icon="pi pi-exclamation-triangle" [width]="400" [responsive]="true" appendTo="body">
    <p-footer>
        <button type="button" pButton label="Cancelar" class="ui-button-info botonModal" (click)="dialogo.reject()"></button>
        <button type="button" pButton label="Aceptar" class="ui-button-success botonModal" (click)="dialogo.accept()"></button>
    </p-footer>
</p-confirmDialog>
<!--fin modal eliminacion de subposicion-->
