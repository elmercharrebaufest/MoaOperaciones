<div class="col-xs-12 col-sm-12 col-md-12 margenInput" style="margin: 15px 0;">
    <div class="col-xs-8 col-sm-6 col-md-4 col-lg-4 ui-fluid margenInput">
        <strong>Válidos</strong>
        <p-chips [(ngModel)]="posicion.proveedoresValidos" name="posicion.proveedoresValidos" styleClass="widthAutocomplete" id="proveedoresValidos" [suggestions]="resultadoProveedores" 
                    addOnTab="true" [addOnBlur]="true">
        </p-chips>
    </div>

    <div class="col-xs-8 col-sm-6 col-md-4 col-lg-4 ui-fluid margenInput">
        <strong>Inválidos</strong>
        <p-chips [(ngModel)]="posicion.proveedoresInvalidos" name="posicion.proveedoresInvalidos" styleClass="widthAutocomplete" id="proveedoresInvalidos" [suggestions]="resultadoProveedores" (completeMethod)="search($event)"
                    addOnTab="true" [addOnBlur]="true">
        </p-chips>
    </div>

    <div class="col-xs-8 col-sm-6 col-md-4 col-lg-4 ui-fluid margenInput">
        <strong>No sugeridos</strong>
        <p-chips [(ngModel)]="posicion.proveedoresNoSugeridos" name="posicion.proveedoresNoSugeridos" styleClass="widthAutocomplete" id="proveedoresNoSugeridos" [suggestions]="resultadoProveedores"
                    (completeMethod)="search($event)" addOnTab="true" [addOnBlur]="true">
        </p-chips>
    </div>
</div>
