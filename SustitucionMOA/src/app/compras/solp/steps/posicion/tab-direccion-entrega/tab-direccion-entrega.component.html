<div class="row" style="margin: 15px 0;">
  <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12" >
    <div class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
      <strong>Nombre *</strong>
      <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.nombreEntrega" id="nombreEntrega" placeholder="Ingrese nombre" maxlength="40" rows="1" />
      <div *ngIf="mostrarValidacion('nombreEntrega', posicion.nombreEntrega)">
        <p class="text-danger" style="margin: 0;">campo obligatorio</p>
      </div>
    </div>

    <div class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
      <strong>Calle y Número *</strong>
      <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.calleEntrega" id="calleEntrega" placeholder="Ingrese la calle" rows="1" />
      <div *ngIf="mostrarValidacion('calleEntrega', posicion.calleEntrega)">
          <p class="text-danger" style="margin: 0;">campo obligatorio</p>
      </div>
    </div>

    <div class="col-xs-8 col-sm-6 col-md-2 col-lg-2 margenInput">
      <strong>Teléfono</strong>
      <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.numeroEntrega" id="numeroEntrega" placeholder="" rows="1" /> 
    </div>  
  </div>
  
  <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
    <div class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
      <strong>C&oacute;digo postal *</strong>
      <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.codigoPostalEntrega" id="codigoPostalEntrega" placeholder="Ingrese codigo postal"
          maxlength="40" rows="1" />
      <div *ngIf="mostrarValidacion('codigoPostalEntrega', posicion.codigoPostalEntrega)">
        <p class="text-danger" style="margin: 0;">campo obligatorio</p>
      </div>
    </div>

    <div class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
      <strong>Pa&iacute;s</strong>
      <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.paisEntrega" id="paisEntrega" placeholder="Ingrese el pais" rows="1" />
    </div>

    <div class="col-xs-8 col-sm-6 col-md-2 col-lg-2 margenInput">
      <strong>Provincia</strong>
      <p-dropdown 
            [showClear]="true"
            dataKey="ProvinciaId"
            filter="true"
            [options]="provinciaEntrega" 
            placeholder="Provincia" 
            [(ngModel)]="posicion.selectProvincia" 
            [style]="{'width':'150px'}" 
            optionLabel="Nombre" 
            appendTo="body"                      
            (onFocus)=" $event.target.select();"                    
            (completeMethod)="buscarCombo($event, 'PROVINCIA')"       
            [disabled]="disabled" >
        </p-dropdown>
    </div>
  </div>
</div>
