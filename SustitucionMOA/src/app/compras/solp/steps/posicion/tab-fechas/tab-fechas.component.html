  <!-- Row fechas de entrega -->
  <div class="row" style="margin: 15px 0;">
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">

      <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4">
        <div>
            <strong>Fecha de entrega</strong>
        </div>
        <div class="styled-select">
            <p-calendar [(ngModel)]="posicion.fechaEntregaServicio" [locale]="locale" [showIcon]="true" dateFormat="dd-M-yy" appendTo="body" [readonlyInput]="true" [minDate]="hoy" (onSelect)="calcularEntregaCalendario()"></p-calendar>
        </div>
        <div *ngIf="mostrarValidacion('fechaEntregaServicio', posicion.fechaEntregaServicio)">
            <p class="text-danger">campo obligatorio</p>
        </div>
      </div>

      <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4">
        <div class="ejecucionCompras" style="margin: 0;">
          Plazo de entrega previsto &nbsp;
        </div>
        <div>
          <input pInputText type="text" pKeyFilter="pnum" [(ngModel)]="posicion.plazoDeEntrega" class="fourRounded widthInputDias" aria-controls="tableModal" placeholder="" (change)="calcularFechaEntrega()" />
          <div *ngIf="mostrarValidacion('plazoDeEntrega', posicion.plazoDeEntrega)">
              <p class="text-danger">campo obligatorio</p>
          </div>
        </div>
      </div>
    </div>
  </div>
<!-- End Row fechas de entrega -->
