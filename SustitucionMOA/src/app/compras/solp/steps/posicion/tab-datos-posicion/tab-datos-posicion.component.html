<!-- Row grupo de compras -->
<div class="row" style="margin: 15px 0;">
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12" style="display: flex; flex-wrap: wrap;">
        <div *ngIf="mostrarCamposTipoSolp('selectGrupoCompras')" class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
            <strong>Grupo de compras *</strong>
                <p-dropdown 
                    dataKey="Id"
                    filter="true"
                    [options]="grupoCompras" 
                    placeholder="Grupo Compras" 
                    [(ngModel)]="posicion.selectGrupoCompras" 
                    [style]="{'width':'150px'}" 
                    optionLabel="CodigoDescripcion" 
                    appendTo="body"                      
                    (onFocus)=" $event.target.select();"                    
                    (completeMethod)="buscarCombo($event, 'GRUPO COMPRAS')"       
                    [disabled]="disabled" >
                </p-dropdown>
            <div *ngIf="mostrarValidacion('selectGrupoCompras', posicion.selectGrupoCompras)">
                <p class="text-danger">campo obligatorio</p>
            </div>
        </div>

        <div *ngIf="mostrarCamposTipoSolp('selectSolicitanteCompras')" class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
            <strong>Solicitante *</strong>
            <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.selectSolicitanteCompras" id="selectSolicitanteCompras" placeholder="Ingrese solicitante"
                rows="1" />
            <div *ngIf="mostrarValidacion('selectSolicitanteCompras', posicion.selectSolicitanteCompras)">
                <p class="text-danger">campo obligatorio</p>
            </div>
        </div>

        <div *ngIf="mostrarCamposTipoSolp('necesidadCompras')" class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
            <strong>N° Necesidad</strong>
            <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" [(ngModel)]="posicion.necesidadCompras" id="necesidadCompras" placeholder="Ingrese Nro de necesidad" rows="1" />
        </div>

        <div *ngIf="mostrarCamposTipoSolp('selectArticuloCompras')" class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
            <strong>Grupo de art&iacute;culo * </strong>
            <p-dropdown 
                dataKey="Id"
                filter="true"
                [options]="articuloCompras" 
                placeholder="Articulo Compras" 
                [(ngModel)]="posicion.selectArticuloCompras" 
                [style]="{'width':'150px'}" 
                optionLabel="CodigoDescripcion" 
                appendTo="body"                      
                (onFocus)=" $event.target.select();"                    
                (completeMethod)="buscarCombo($event, 'ARTICULO COMPRAS')"       
                [disabled]="disabled" >
            </p-dropdown>
            <div *ngIf="mostrarValidacion('selectArticuloCompras', posicion.selectArticuloCompras)">
                <p class="text-danger" style="margin: 0;">campo obligatorio</p>
            </div>
        </div>
    </div>
</div>

<div class="row" style="margin: 0;">
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div *ngIf="mostrarCamposTipoSolp('textoSuministro')" class="col-xs-8 col-sm-6 col-md-6 col-lg-6 margenInput">
            <strong>Texto de suministro *</strong>
            <textarea [(ngModel)]="posicion.textoSuministro" class="inputGrilla" id="observaciones" placeholder="Ingrese texto de suministro" cols="30" rows="5"></textarea>
            <div *ngIf="mostrarValidacion('textoSuministro', posicion.textoSuministro)">
                <p class="text-danger" style="margin: 0;">campo obligatorio</p>
            </div>
        </div>
    

        <div *ngIf="mostrarCamposTipoSolp('motivo')" class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
            <strong>Motivo *</strong>
            <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" placeholder="Ingrese motivo" [(ngModel)]="posicion.motivo" id="motivo" rows="1" />
            <div *ngIf="mostrarValidacion('motivo', posicion.motivo)">
                <p class="text-danger" style="margin: 0;">campo obligatorio</p>
            </div>
        </div>

        <div *ngIf="mostrarCamposTipoSolp('modelo')" class="col-xs-8 col-sm-6 col-md-3 col-lg-3 margenInput">
            <strong>Modelo *</strong>
            <input pInputText class="styled-select1 widthAutocomplete p-inputtext-lg inputGrilla" placeholder="Ingrese modelo" [(ngModel)]="posicion.modelo" id="modelo" rows="1" />
            <div *ngIf="mostrarValidacion('modelo', posicion.modelo)">
                <p class="text-danger">campo obligatorio</p>
            </div>
        </div>
    </div>

</div> 
<!-- End Row grupo de compras -->
