<div class="row mt-2">
    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p> &nbsp; <!-- dummy spacer --> </p>
        <span class="ui-float-label">
            <input id="buscarSolpNumero" type="text" pInputText style="width:100%">
            <label for="buscarSolpNumero" class="fa fa-search">Buscar N° SOLP</label>
        </span>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p>Ver:</p>
        <filtro-fecha key="periodo-certificaciones"></filtro-fecha>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p>Creador</p>
        <p-multiSelect [options]="usuarioFiltro" [(ngModel)]="selectUsuario" defaultLabel="Buscar por usuario"
                       [maxSelectedLabels]="1" selectedItemsLabel="{0} usuarios elegidos"></p-multiSelect>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p>Fiscal Contrato</p>
        <p-multiSelect [options]="usuarioFiltro" [(ngModel)]="selectUsuario" defaultLabel="Buscar por usuario"
                       [maxSelectedLabels]="1" selectedItemsLabel="{0} usuarios elegidos"></p-multiSelect>
    </div>

    <div class="col-xs-4 col-sm-2 col-md-1 mb-5">
        <p-checkbox binary="true" label="Sap" [(ngModel)]="sap"></p-checkbox>
    </div>

    <div class="col-xs-8 col-sm-4 col-md-2 mb-5">
        <p-checkbox binary="true" label="Mantenimiento" [(ngModel)]="mantenimiento"></p-checkbox>
    </div>
</div>
