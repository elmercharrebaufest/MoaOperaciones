<div class="row mt-2">
    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p> &nbsp; <!-- dummy spacer --> </p>
        <span class="ui-float-label">
            <input id="buscarSolpNumero" type="text" pInputText style="width:100%" [(ngModel)]="numeroSolp" (keyup)="searchParametersChanged()">
            <label for="buscarSolpNumero" class="fa fa-search">Buscar N° SOLP</label>
        </span>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p>Ver:</p>
        <filtro-fecha key="periodo-certificaciones" (ClickEvent)="searchParametersChanged()"></filtro-fecha>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p>Creador</p>
        <p-multiSelect [options]="creadores" [(ngModel)]="creador" defaultLabel="Buscar por usuario"
                       [maxSelectedLabels]="1" selectedItemsLabel="{0} usuarios elegidos"
                       (onChange)="searchParametersChanged()"></p-multiSelect>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-3 mb-5">
        <p>Fiscal Contrato</p>
        <p-multiSelect [options]="fiscales" [(ngModel)]="fiscal" defaultLabel="Buscar por usuario"
                       [maxSelectedLabels]="1" selectedItemsLabel="{0} usuarios elegidos"
                       (onChange)="searchParametersChanged()"></p-multiSelect>
    </div>

    <div class="col-md-4 col-lg-3">
        <div class="col-md-4" style="padding:0 !important;">
            <p-checkbox class="checkboxFechas" binary="true" label="SAP" pTooltip="SAP"
                        [(ngModel)]="sap" (onChange)="searchParametersChanged()"></p-checkbox>
        </div>
        <div class="col-md-4" style="padding:0 !important;">
            <p-checkbox class="checkboxFechas" binary="true" label="OT" pTooltip="Mantenimiento"
                        [(ngModel)]="mantenimiento" (onChange)="searchParametersChanged()"></p-checkbox>
        </div>
        <div class="col-md-4" style="padding:0 !important;">
            <p-checkbox class="checkboxFechas" binary="true" label="Web" pTooltip="WEB"
                        [(ngModel)]="web" (onChange)="searchParametersChanged()"></p-checkbox>
        </div>
        <div class="col-md-4" style="padding:0 !important;">
            <p-checkbox class="checkboxFechas" binary="true" label="RA" pTooltip="Reposición Automática"
                        [(ngModel)]="repoAutomatica" (onChange)="searchParametersChanged()"></p-checkbox>
        </div>
        <div class="col-md-4" style="padding:0 !important;">
            <p-checkbox class="checkboxFechas" binary="true" label="CM" pTooltip="Contrato Marco"
                        [(ngModel)]="contratoMarco" (onChange)="searchParametersChanged()"></p-checkbox>
        </div>
    </div>
</div>

<div class="content-wraper rounded shadow">
    <section class="container-fluid clearfix">
        <p-table class="table-responsive" styleClass="font-size: 10px" #tabla [value]="solps" dataKey="Id" [autoLayout]="true">
            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th class="columna">Vincular</th>
                    <th class="columna">N° SOLP</th>
                    <th class="columna">Nombre SOLP</th>
                    <th class="columna">Fecha Creación</th>
                    <th class="columna">Creador</th>
                    <th class="columna">Fiscal Contrato</th>
                    <th class="columna">Estado SOLP</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-solp>
                <tr>
                    <td>
                        <p-checkbox binary="true" [(ngModel)]="solp.Selected" (onChange)="notifyChange()"></p-checkbox>
                        <span *ngIf="solp.TipoSolpSap == 2">
                            <img class="pointer" src="./Content/images/icons/worker.svg" alt="Mantenimiento"
                                 style="height:25px; cursor:default" />
                        </span>
                        <span *ngIf="solp.TipoSolpSap == 3">
                            <img class="pointer" src="./Content/images/icons/SAP.svg" alt="SAP"
                                 style="width: 30px; height: 30px; cursor:default" />
                        </span>
                    </td>
                    <td>{{ solp.NumeroSolp }}</td>
                    <td>{{ solp.NombreSolp }}</td>
                    <td>{{ solp.FechaCreacion | customDateFormat | date :'d/M/yyyy' }}</td>
                    <td>{{ solp.Creador }}</td>
                    <td>{{ solp.Fiscal }}</td>
                    <td>{{ solp.Estado }}</td>
                </tr>
            </ng-template>
        </p-table>
    </section>
</div>
