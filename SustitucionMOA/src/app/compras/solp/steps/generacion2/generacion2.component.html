<form [formGroup]="formulario2">
    <div class="container-fluid">
        <!-- CONTENT-->
        <!-- Contiene todo -->
        <section class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <mensaje></mensaje>
            <div class="inputCompras">
                <div class="row myRow" style="padding-top: 2px;">
                    <div class="row myRow alinearTitulo">
                        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">

                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.visitaDeObra" label="Visita de obra" binary="true" formControlName="visitaDeObra">
                                </p-checkbox>
                            </div>


                            <div class="col-xs-12 col-sm-6 col-md-6 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.visitaDeObraMasiva" label="Visita de obra masiva" formControlName="visitaDeObraMasiva"
                                            binary="true"></p-checkbox>
                            </div>

                            <div *ngFor="let visita of model.listaVisitas">
                                <div class="col-xs-12 col-sm-12 col-md-7 margenInput">
                                    <div class="styled-select">
                                        <p-calendar [ngModelOptions]="{standalone:true}" [style]="{'width': '75%'}" [(ngModel)]="visita.visitaDeObraFecha"
                                                    [locale]="locale" [showIcon]="true" dateFormat="dd-M-yy" appendTo="body"
                                                    [disabled]="!model.visitaDeObraMasiva" [readonlyInput]="true"
                                                    [minDate]="hoy"></p-calendar>
                                    </div>
                                </div>

                                <div class="col-xs-12 col-sm-12 col-md-4 prime-hora margenInput">
                                    <div>
                                        <p-calendar [ngModelOptions]="{standalone:true}" class="styled-select" [(ngModel)]="visita.visitaDeObraHora"
                                                    [locale]="locale" [showIcon]="true" icon="fa fa-clock-o"
                                                    [disabled]="!model.visitaDeObraMasiva" [timeOnly]="true"></p-calendar>
                                    </div>
                                </div>
                                <div class="col-xs-12 col-sm-12 col-md-1" style="right: 20px;">
                                    <span (click)="model.visitaDeObraMasiva ? eliminarVisita(visita.id) : null">
                                        <img [class.pointer]="model.visitaDeObraMasiva"
                                             src="./Content/images/icons/trash.svg" alt="trash"
                                             style="padding: 8px;" />
                                    </span>
                                </div>
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <div>
                                    <span (click)="model.visitaDeObraMasiva ? agregarNuevaVisita() : null"
                                          [class.pointer]="model.visitaDeObraMasiva" class="enlaceVisita"
                                          [class.disabled]="!model.visitaDeObraMasiva">
                                        <i class="fa fa-plus-square"></i>&nbsp; Agregar nueva visita de obra
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                Responsable sector *
                                <div class="col-md-12 ui-fluid" style="padding-left: 0em;">
                                    <p-chips [(ngModel)]="model.supervisorSector" formControlName="supervisorSector" name="supervisorSector" placeholder="Ingrese responsable" id="supervisorSector" [suggestions]="resultadoSupervisorSector" (completeMethod)="search($event)" addOnTab="true" [addOnBlur]="true" (blur)="onBlur('supervisorSector')"></p-chips>
                                </div>
                                <div  *ngIf="mostrarValidacion('supervisorSector', model.supervisorSector)">
                                    <p class="text-danger">campo obligatorio</p>
                                </div>
                            </div>
                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                Responsable de trabajo *
                                <div class="col-md-12 ui-fluid" style="padding-left: 0em;">
                                    <p-chips [(ngModel)]="model.supervisorTrabajo" formControlName="supervisorTrabajo" name="supervisorTrabajo" placeholder="Ingrese responsable" id="supervisorTrabajo" [suggestions]="resultadoSupervisorTrabajo" (completeMethod)="search($event)" addOnTab="true" [addOnBlur]="true" (blur)="onBlur('supervisorTrabajo')"></p-chips>
                                </div>
                                <div *ngIf="mostrarValidacion('supervisorTrabajo', model.supervisorTrabajo)">
                                    <p class="text-danger">campo obligatorio</p>
                                </div>
                            </div>
                        </div>

                    </div>


                    <div class="row myRow margenInput alinearTitulo" style="padding-top: 2px;">

                        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">


                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.obradores" label="Obradores" binary="true" formControlName="obradores"></p-checkbox>
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.modoElevacion" label="Medio de elevación" formControlName="modoElevacion"
                                            binary="true"></p-checkbox>
                            </div>
                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.andamio" label="Andamios" formControlName="andamio"
                                            binary="true"></p-checkbox>
                            </div>

                             <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.grillaPersonal" label="Grilla personal/horas" formControlName="grillaPersonal"
                                            binary="true"></p-checkbox>
                            </div> 

                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.tecnicoSeguridad" label="Técnico de seguridad" formControlName="tecnicoSeguridad"
                                            binary="true"></p-checkbox>
                            </div>

                            <!-- <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.fabricacionTallerExterno" label="Fabricacion en taller externo" formControlName="fabricacionTallerExterno"
                                            binary="true"></p-checkbox>
                            </div> -->

                        </div>

                        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">


                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.descripcionTecnica" formControlName="descripcionTecnica"
                                            label="Descripción técnica del trabajo" binary="true"></p-checkbox>
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-12 margenInput">
                                <p-checkbox [ngModelOptions]="{standalone:true}" [(ngModel)]="model.entregaDocumentacion" formControlName="entregaDocumentacion"
                                            label="Entrega de documentación técnica" binary="true"></p-checkbox>
                            </div>

                            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 inputRight margenInput">
                                <div class="col-xs-12 col-sm-12 col-md-12 " [ngClass]="{'disabled': model.tipoSolp === 'SIN_PLIEGO'}">
                                    Fecha límite de consulta
                                </div>

                                <div class="col-xs-12 col-sm-12 col-md-8">
                                    <div class="styled-select">
                                        <p-calendar [ngModelOptions]="{standalone:true}" [style]="{'width': '75%'}" [(ngModel)]="model.fechaLimiteFecha"
                                                    [locale]="locale" [showIcon]="true" dateFormat="dd-M-yy" appendTo="body" 
                                                    [readonlyInput]="true" [minDate]="hoy"></p-calendar>
                                    </div>
                                </div>

                                <div class="col-xs-12 col-sm-12 col-md-4 prime-hora">
                                    <p-calendar [ngModelOptions]="{standalone:true}" class="styled-select" [(ngModel)]="model.fechaLimiteHora" 
                                                [locale]="locale" [showIcon]="true" icon="fa fa-clock-o" [timeOnly]="true">
                                    </p-calendar>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="row myRow">
                        <div class="col-xs-12 col-sm-12 col-md-12">

                            <label class="labelCompras" for="editorTexto"> Observaciones:</label>

                            <quill-editor [ngModelOptions]="{standalone:true}" appDragAndDrop id="observaciones" [(ngModel)]="model.observacionesGeneracion"
                                          [styles]="{'height':'160px'}" (onFileDropped)="fileChange($event)"
                                          (onSelectionChanged)="selectionChange($event)" placeholder="" [modules]="modulesEditor">

                                <div quill-editor-toolbar>
                                    <span class="ql-formats">
                                        <select class="ql-size">
                                            <option value="small"></option>
                                            <option selected></option>
                                            <option value="large"></option>
                                            <option value="huge"></option>
                                        </select>
                                    </span>

                                    <span class="ql-formats">
                                        <button class="ql-bold" aria-label="bold"></button>
                                        <button class="ql-italic" aria-label="italic"></button>
                                        <button class="ql-underline" aria-label="underline"></button>
                                        <button class="ql-strike" aria-label="strike"></button>
                                    </span>

                                    <span class="ql-formats">
                                        <button class="ql-list" value="ordered"></button>
                                        <button class="ql-list" value="bullet"></button>
                                        <button class="ql-indent" value="-1"></button>
                                        <button class="ql-indent" value="+1"></button>
                                    </span>


                                    <span class="ql-formats">
                                        <select class="ql-align">
                                            <option selected></option>
                                            <option value="center"></option>
                                            <option value="right"></option>
                                            <option value="justify"></option>
                                        </select>
                                    </span>
                                    <span class="ql-formats">
                                        <button aria-label="Borra estilos" class="ql-clean" type="button"></button>
                                        <button aria-label="Adjuntar imagen" class="ql-image" type="button"></button>
                                    </span>
                                </div>

                            </quill-editor>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 alinearTitulo">
                    <div class="margenInput obligatorio">
                        * Campos obligatorios
                    </div>
                </div>
            </div>
            <!-- END form-->
        </section>
        <!--End CONTENT-->
    </div>
</form>
