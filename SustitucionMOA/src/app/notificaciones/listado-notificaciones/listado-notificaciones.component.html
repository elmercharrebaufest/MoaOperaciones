<div class="content-wraper">
  <!-- CONTENT-->
  <section class="container-fluid clearfix">
    <!--Title-->
    <div class="row titleSection">
      <div class="col-xs-12 col-sm-10 "><strong>Notificaciones</strong> </div>
      <div class="col-xs-12 col-sm-2" style="display: flex; justify-content: flex-end;">
        <!-- Button trigger modal -->
        <button type="button" class="btn btn-custom col-xs-12 col-sm-11 btn-add btn-grande"
          (click)="goToSeccion('/notificaciones/alta')" id="modalToggleButton">
          Nueva notificación
        </button>

      </div>
    </div>
    <!--End Title-->
    <!--Search-->
    <div class="myRow firstSection mySearch">
      <div class="col-xs-12 col-md-12 rounded shadow animate no-padding-left-right">
        <div class="col-xs-12 col-md-12 search-header">
          <title-caps>Refinar resultados</title-caps>
        </div>
        <div id="searchTexto" class="col-xs-6 col-sm-4 col-md-5 ">
          Por Razon Social/CUIT:
          <div class="styled-select ">
            <input type="search" class="" placeholder="" [value]="" aria-controls="tableModal" [(ngModel)]="filtroAlta">
          </div>
        </div>
        <div class="col-xs-6  col-sm-4 col-md-5">
          Por Estado:
          <div class="styled-select ">

          </div>
        </div>
      </div>

    </div>

    <!-- End Search-->
    <!-- Tables-->
    <div class="row myRow">
      <div class="clearfix myTables">
        <mensaje></mensaje>
        <spinner></spinner>
        <table *ngIf="data && data.length != 0;" id="tableModal"
          class="display nowrap dataTable no-footer dtr-inline rounded shadow animate ccpp-table" cellspacing="0"
          role="grid" aria-describedby="tableModal_info"
          style="width: 100%; padding:10px 0; background: white !important;">
          <thead>
            <tr role="row">
              <th tabindex="0" rowspan="1" colspan="1" (click)="orderColumnBy('Nombre')">
                Nombre<div>
                  <span>
                    <i
                      [ngClass]="{'fa': true, 'fa-arrow-up': true, 'arrow': true, 'unselected': orderedByColumn === 'CodigoProveedor' && orderDirection > 0 }"></i>
                    <i
                      [ngClass]="{'fa': true, 'fa-arrow-down': true, 'arrow': true, 'unselected': orderedByColumn === 'CodigoProveedor' && orderDirection < 0 }"></i></span>
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let notificacion of data 
                                | orderedColumn : {property: orderedByColumn, direction: orderDirection}  
                                | paginate: { itemsPerPage:itemsPerPage, currentPage: p } 
                                ; let odd = odd" role="row" [class.odd]="!odd">
              <td>{{notificacion.Nombre || "-"}}</td>
            </tr>
          </tbody>
        </table>
        <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="data && data.length != 0">
          <div class="dataTables_paginate paging_simple_numbers">
            <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()"
              [class.disabled]="pT.isFirstPage()"> Anterior </a>
            <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
              <a class="paginate_button" (click)="pT.setCurrent(page.value)"
                *ngIf="pT.getCurrent() !== page.value">{{ page.label }}</a>
              <a class="paginate_button current" *ngIf="pT.getCurrent() === page.value">{{ page.label }}</a>
            </span>
            <a id="tableModal_next" class="paginate_button next" (click)="pT.next()" [class.disabled]="pT.isLastPage()">
              Siguiente </a>
          </div>
        </pagination-template>
      </div>
    </div>
    <!-- END tables-->
  </section>
  <!--End CONTENT-->
</div>
