<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 ">Usuario: <strong>Alta</strong> </div>
        </div>
        <!--End Title-->
        <!-- Form-->
        <div class="row myRow firstSection mySearch cargaDeDatos">
            <div class="rounded shadow">
                <div class="row myRow cargaDeDatosFields cargaDeDatosForm">
                    <div class="col-xs-12 col-sm-12">
                        N&uacute;mero Proveedor:
                        <div class="styled-select ">
                            <input type="search" [(ngModel)]="numeroProveedor" class="fourRounded" placeholder="" aria-controls="tableModal">
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-12">
                        Tipo:
                        <div class="styled-select perfiles-select">
                            <dropdown #dropdown_tipo [tipoDropdown]="'selectInput'" [options]="tipoOptions"></dropdown>
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-12">
                        Email:
                        <div class="styled-select ">
                            <input type="search" [(ngModel)]="email" class="fourRounded" placeholder="" aria-controls="tableModal">
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-12">
                        Perfiles:
                        <div class="styled-select perfiles-select">
                            <dropdown #dropdown_perfil [tipoDropdown]="'selectInput'" [options]="perfilOptions"></dropdown>

                        </div>
                    </div>
                </div>
                <hr>
                <div class="row myRow cargaDeDatosBtn" *ngIf="visibleButton">
                    <div class="col-xs-12 col-sm-3 col-sm-offset-9 ">
                        <a (click)="alta()" href="#" style="text-decoration:none!important">
                            <div class="btnSection animate">Alta <span class="fa  fa-play "></span></div>
                        </a>
                    </div>
                </div>
            </div>
            <spinner></spinner>
            <mensaje></mensaje>
        </div>


        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
