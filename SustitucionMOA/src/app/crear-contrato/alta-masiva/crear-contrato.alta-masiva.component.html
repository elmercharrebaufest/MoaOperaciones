<style>
    .fieldset {
        max-width: 650px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 2px 2px #88888854;
        padding: 20px;
        margin-top: 15px;
    }

    .subtitulo {
        box-sizing: border-box;
        color: blue;
        display: table;
        max-width: 100%;
        padding: 0;
        white-space: normal;
        font-weight: 600 !important;
        font-size: large;
    }
    /* The switch - the box around the slider */
    .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 28px;
        background-color: transparent !important;
        margin: 0 !important;
    }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

    /* The slider */
    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: .4s;
        transition: .4s;
    }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

    input:checked + .slider {
        background-color: #2196F3;
    }

    input:focus + .slider {
        box-shadow: 0 0 1px #2196F3;
    }

    input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
    }

    /* Rounded sliders */
    .slider.round {
        border-radius: 34px;
    }

        .slider.round:before {
            border-radius: 50%;
        }

    .labelSwitch {
        top: 5px;
        position: relative;
        margin-left: 7px;
    }
</style>
<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 "> <strong>Alta Masiva</strong> </div>
        </div>
        <mensaje></mensaje>
        <fieldset class="fieldset" *ngIf="!this.retirados">
            <!--<label class="subtitulo">Condiciones Generales</label>-->
            <div class="row">
                <div class="form-group col-md-6 subtitulo">                    
                    <a href="../../../Documentacion/Carta de certificado de deposito.doc" target="_blank"
                       style="text-decoration:none!important">
                        <div class="doc-header no-border">
                            <p>
                                <i class="fa fa-file-excel-o" aria-hidden="true"></i>Descargar archivo modelo
                            </p>
                        </div>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="form-group col-md-6">
                    <label for="contratoAcuerdo" class="font-weight-bold">Contrato Acuerdo</label>
                    <input type="text" class="form-control" name="cantidad" numeric decimals="0" [(ngModel)]="contratoAcuerdo">

                </div>
                <div class="form-group col-md-6">
                    <label for="certificadoExclusionGanancias">
                        <span class="link-adjuntar">Click aqui para adjuntar archivo</span>
                    </label>
                    <input type="file" class="form-control-file" style="display:none;" id="certificadoExclusionGanancias"
                           (change)="handleFileInput($event.target.files, 'certificadoExclusionGanancias')"
                            accept="application/vnd.ms-excel">


                    <div class="container-archivos" style="padding-top:7px;">                        
                            <i class="link-archivo">{{archivoNombre}}</i>                        
                    </div>
                </div>
            </div>

            <br />
            <div class="row">
                <div class="form-group col-md-12">
                    <spinner></spinner>
                    <button type="button" class="btn-custom btn-mediano btn-add animate " (click)="grabarContratoAltaMasiva()" *ngIf="!this.spinnerComponent.visible"
                            style="margin: 0 10px; height: 30px; align-items: center; display: inline-flex;">
                        Grabar
                    </button>
                    <button type="button" class="btn-custom btn-mediano btn-add animate " (click)="irACargas()"
                            style="margin: 0 10px; height: 30px; align-items: center; display: inline-flex;background-color:#eee;color:black !important;">
                        Volver
                    </button>
                </div>
            </div>
        </fieldset>




    </section>
    <!--End CONTENT-->
</div>

<!-- Modal confirmar -->
<a href="#confirmModal" class="trigger-btn" id="openModalConfirmModal" data-toggle="modal" style="display:none;">    Click    to Open Confirm Modal</a>
<div class="modal fade fade-complete" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" data-keyboard="false"
     data-backdrop="false" style="background-color: rgba(0, 0, 0, 0.5);">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel">Confirmacion</h4>
            </div>
            <div class="modal-body modal-notificacion">
                <p>
                    El contrato se genero correctamente.
                </p>

            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="irACargas()">Aceptar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal mensaje -->
<a href="#mensajeModal" class="trigger-btn" id="openModalMensajeModal" data-toggle="modal" style="display:none;">    Click    to Open mensaje Modal</a>
<div class="modal fade fade-complete" id="mensajeModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
     data-backdrop="false" style="background-color: rgba(0, 0, 0, 0.5);">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close btn-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">Mensaje</h4>
            </div>
            <div class="modal-body modal-notificacion">
                <p>
                    {{mensajeModal}}
                </p>

            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" data-dismiss="modal">Aceptar</button>
            </div>
        </div>
    </div>
</div>
