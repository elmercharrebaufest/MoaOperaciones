<div class="col-xs-12">
    <div class="alert alert-danger" *ngIf="errorMsg"><i class="fa fa-exclamation-triangle" aria-hidden="true"></i>{{errorMsg}}</div>

    <div class="alert alert-warning" *ngIf="infoMsg"><i class="fa fa-info" aria-hidden="true"></i>{{infoMsg}}</div>

    <div class="alert alert-success" *ngIf="successMsg"><i class="fa fa-thumbs-o-up" aria-hidden="true"></i>{{successMsg}}</div>
</div>
