<dropdown [tipoDropdown]="'periodos'" (select)="setPeriodo($event)" [key]="key" class="styled-select"></dropdown>

<div *ngIf="periodo == '4'">
    <div class="col-xs-12 col-sm-6 col-md-12 entrefechas_1 searchVerSelect ">
        Desde:
        <form action="" class="form-horizontal styled-select form_datetime_form1" role="form">
            <fieldset>
                <div>
                    <div class="input-group date form_datetime1" data-date="" data-date-format="yyyy-MM-dd"
                        data-link-field="dtp_input1">
                        <input type="text" value="{{fecha_inicio}}" id="noCursor" readonly>
                        <span class="input-group-addon"><span class="fa fa-calendar "></span></span>
                    </div>
                    <input type="hidden" #dtp_input1 id="dtp_input1" class="dtp_input1" value="{{fecha_inicio}}" />
                    <br />
                </div>
            </fieldset>
        </form>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-12 entrefechas_1 entrefechas_2 searchVerSelect ">
        Hasta:
        <form action="" class="form-horizontal styled-select form_datetime_form2" role="form">
            <fieldset>
                <div>
                    <div class="input-group date form_datetime2" data-date="" data-date-format="yyyy-MM-dd"
                        data-link-field="dtp_input2">
                        <input type="text" value="{{fecha_fin}}" id="noCursor" readonly />
                        <span class="input-group-addon"><span class="fa fa-calendar "></span></span>
                    </div>
                    <input type="hidden" #dtp_input2 id="dtp_input2" class="dtp_input2" value="{{fecha_fin}}" />
                    <br />
                </div>
            </fieldset>
        </form>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-12 text-danger" *ngIf="leyenda">
        * {{leyenda}}
    </div>
    <div id="btnAplicar" class="myRow cargaDeDatos cargaDeDatosBtn entrefechas_1 entrefechas_3 searchVerSelect clearfix ">
        <div class="col-xs-12 col-sm-12 col-md-12  clearfix " style="padding:0px;">
            <a (click)="filterByDate(dtp_input1.value, dtp_input2.value)" style="text-decoration:none!important">
                <div class="btnSection animate">Aplicar <span class="fa  fa-play "></span></div>
            </a>
        </div>
    </div>

</div>
