<!-- <p-steps [model]="items" styleClass="steps-custom" [readonly]="readonly" [(activeIndex)]="activeIndex" ></p-steps> -->

<style>
.stepper{
    margin-top: 1em;
    padding-top: 1m;
    padding-bottom: 1em;
    height: 10em;
}

.stepper li {
  width: 3em;
  height: 3em;
  text-align: center;
  border-radius: 1.5em;
  background:#F3F3F3;
  margin: 0 3em;
  display: inline-block;
  color: white;
  position: relative;
  box-shadow: 0px 3px 6px #00000029;
}

.stepper li::after{
  content: '';
  position: absolute;
  top: 1.1em;
  left: 2.8em;
  width: 6em;
  height: .5em;
  background: #F3F3F3;
}

.stepper li:last-child::after {
  display: none;
}

.stepper .stepper-item {
  position: absolute;
  top: 3.1em;
  left: -1em;
  text-align: center;
  width: 5em;
  text-decoration: none;
}

.stepper .stepper-item-number {
  font-weight: bold;
  font-size: 1.5em;
}

.stepper .stepper-item-number,
.stepper .stepper-item-title {
  display: block;
  color: #999999;
}

.stepper .active {
  background: #fff;
  border: solid #1B73CB;
}

.stepper li.active::after {
  background: #ECEEEF;
}

.stepper li.active .stepper-item-number,
.stepper li.active .stepper-item-title {
  color: #1B73CB;
}

.stepper .complete {
  background: #5CB85C;
  border: solid #5CB85C;
}

.stepper li.active-complete::after,
.stepper li.complete::after {
  background: #5CB85C;
}

.stepper li.complete .stepper-item-number,
.stepper li.complete .stepper-item-title {
  color: #5CB85C;
}

.stepper .incomplete {
  background: #fff;
  border: solid #EDA24D;
}

.stepper li.active-incomplete::after,
.stepper li.incomplete::after {
  background: #F0AD4E;
}

.stepper li.incomplete .stepper-item-number,
.stepper li.incomplete .stepper-item-title {
  color: #F0AD4E;
}
</style>

<div class="stepper">
    <ul role="tablist">
        <li *ngFor="let item of items; let i = index" [class]="getItemClass(i)">
                <!-- 'ui-state-default':(i !== activeIndex),
                'ui-state-complete':(i < activeIndex),
                'ui-state-disabled ui-steps-incomplete':item.disabled||(i !== activeIndex && readonly)}"> -->
            <!-- <a *ngIf="!item.routerLink" [href]="item.url||'#'" class="ui-menuitem-link" (click)="itemClick($event, item, i)" [attr.target]="item.target" [attr.id]="item.id">
                <span class="ui-steps-number">{{i + 1}}</span>
                <span class="ui-steps-title">{{item.label}}</span>
            </a> -->
            <a [href]="item.url||'#'" class="stepper-item" (click)="itemClick($event, item, i)" [attr.target]="item.target" [attr.id]="item.id">
              <span class="stepper-item-number">Paso {{i + 1}}</span>
              <span class="stepper-item-title">{{item.label}}</span>
          </a>
        </li>
    </ul>
</div>
