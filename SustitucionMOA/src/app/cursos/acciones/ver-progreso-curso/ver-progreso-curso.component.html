<p-dialog [header]="'Progreso Curso '+ (curso | async)?.NombreCurso" [(visible)]="display" (onHide)="cerrar()"
  [modal]="true" [responsive]="true" [style]="{width: '95%', minWidth: '200px', maxWidth:'850px'}" [draggable]="false"
  appendTo="body">
  <div class="row myRow w-full h-fit max-h-450px overflow-y-auto">
    <div class="clearfix myTables">
      <spinner #spinner></spinner>
      <mensaje #mensaje></mensaje>
      <ng-container *ngIf="progresoEnCurso">
        <table class="display nowrap dataTable no-footer dtr-inline rounded shadow animate ccpp-table" id="tableModal"
          role="grid" style="width: 100%; padding:10px 0; background: white !important;" cellspacing="0">
          <thead>
            <tr role="row">
              <th class="fw-bold fs-medium" id="estadolReporteAlumnos" tabindex="0" rowspan="1" colspan="1">
                Estado
              </th>
              <th class="fw-bold fs-medium" id="iniciadoReporteAlumnos" tabindex="0" rowspan="1" colspan="1">
                Iniciado
              </th>
              <th class="fw-bold fs-medium" id="intentoReporteAlumnos" tabindex="0" rowspan="1" colspan="1">
                Ultimo intento
              </th>
              <th class="fw-bold fs-medium" id="comletadoReporteAlumnos" tabindex="0" rowspan="1" colspan="1">
                Completado
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{progresoEnCurso.EstadoDescripcion}}</td>
              <td>{{progresoEnCurso.FechaIniciado||'---'}}</td>
              <td>{{progresoEnCurso.FechaUltimoIntento || '---'}}</td>
              <td>{{progresoEnCurso.FechaCompletado || '---'}}</td>
            </tr>
          </tbody>
        </table>
      </ng-container>
    </div>
  </div>
</p-dialog>
