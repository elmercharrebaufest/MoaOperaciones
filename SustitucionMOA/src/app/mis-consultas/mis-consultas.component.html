<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 "><strong>Mis Consultas</strong> </div>
        </div>
        <!--End Title-->
        <!--Search-->
        <div class="myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow animate no-padding-left-right">
                <div class="col-xs-12 col-md-12 search-header">
                    <title-caps>Refinar resultados</title-caps>
                </div>
                <div id="searchTexto" class="col-xs-4 col-sm-12 col-md-3 ">
                    Por Razon Social/CUIT:
                    <div class="styled-select ">
                        <input type="search" class="" placeholder="" [value]="" aria-controls="tableModal"
                            [(ngModel)]="filtroAlta">
                    </div>
                </div>

                <div class="col-xs-4 col-sm-12 col-md-2">
                    Por Estado:
                    <div class="styled-select ">
                        <select selected="0">
                            <option value="0" selected>En gestión</option>
                            <option value="1" selected>Finalizada</option>
                            <option value="2" selected>Rechazada</option>
                        </select>
                    </div>
                </div>

                <div class="col-xs-4 col-sm-12 col-md-2">
                    Por Categoria:
                    <div class="styled-select ">
                        <select>
                            <option value="" selected>Todos</option>
                            <option *ngFor="let x of estados" value="{{x.Key}}">{{x.Value}}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row myRow">
            <div class="clearfix myTables">
                <mensaje></mensaje>
                <spinner></spinner>
                <table id="tableModal" class="display nowrap dataTable no-footer dtr-inline rounded shadow animate usuarios-list-table" cellspacing="0" role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1">
                                ID   
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                Solicita
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                Asignado
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                Estado
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                Ult.Modif.
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                Categoría
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1">
                                   
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                
                            </th>
                            <th tabindex="0" rowspan="1" colspan="1">
                                <a href="#">Ver detalle</a>
                            </th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- END tables-->
    </section>
    <!--End CONTENT-->
</div>
