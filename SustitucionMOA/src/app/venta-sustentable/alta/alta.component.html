<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10" style="font-weight: bold;">Nuevo campo sustentable</div>
        </div>
        <mensaje></mensaje>
        <spinner></spinner>
        <app-declaracion-conformidad [proveedorId]="proveedorId" [cosechaId]="cosechaId"
            (resultadoDeclaracion)="onResultadoDeclaracion($event)" [nombreCosecha]="nombreCosecha">
        </app-declaracion-conformidad>
        <!--End Title-->
        <!-- Form-->
        <div class="row myRow mySearch cargaDeDatos">
            <div class="rounded shadow col-xs-12 col-sm-6 col-md-8">
                <div class="row myRow cargaDeDatosFields cargaDeDatosForm" style="padding: 20px;">
                    <div class="row myRow cargaDeDatosFields">
                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Nombre del establecimiento<span class="requerido">*</span>
                            </p>
                            <div class="styled-select ">
                                <input type="search" [(ngModel)]="nombreEstablecimiento" class="fourRounded"
                                    aria-controls="tableModal">
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Localidad <span class="requerido">*</span></p>
                            <app-autocomplete-localidad (onLocalidadSeleccionada)="localidadId = $event">
                            </app-autocomplete-localidad>
                        </div>
                    </div>

                    <div class="row myRow cargaDeDatosFields">
                        <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="esCorredor">
                            <p class="crearConsultaTitulos">Proveedor <span class="requerido">*</span></p>
                            <div class="styled-select" style="overflow: initial;">
                                <app-seleccionar-proveedor (onLocalidadSeleccionada)="onselect($event)">
                                </app-seleccionar-proveedor>
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="!esCorredor">
                            <p class="crearConsultaTitulos">CUIT <span class="requerido">*</span></p>
                            <div class="styled-select" style="overflow: initial;">
                                <input type="search" [(ngModel)]="CUIT" class="fourRounded" mask="00-00000000-0"
                                    maxlength="13" (change)="verificarCUITIngresado()" aria-controls="tableModal">
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Cosecha <span class="requerido">*</span></p>
                            <div class="styled-select">
                                <!-- <p-dropdown placeholder="Elegir cosecha" [options]="cosechas" [(ngModel)]="cosecha"
                                    optionLabel="Nombre">
                                </p-dropdown> -->

                                <select [(ngModel)]="cosechaId" (change)="onChangeCosecha()">
                                    <option *ngFor="let x of cosechas" value="{{x.Id}}">{{x.Nombre}}</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row myRow cargaDeDatosFields">
                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Hectareas Totales<span class="requerido">*</span></p>
                            <div class="styled-select ">
                                <input min="1" [type]="'number'" name="hectareasTotales" [(ngModel)]="hectareasTotales"
                                    class="fourRounded" aria-controls="tableModal">
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Hectareas de Soja<span class="requerido">*</span></p>
                            <div class="styled-select ">
                                <input type="number" name="hectareasSoja" [(ngModel)]="hectareasSoja"
                                    class="fourRounded" aria-controls="tableModal">
                            </div>
                        </div>
                    </div>

                    <div class="row myRow cargaDeDatosFields">
                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Latitud<span class="requerido">*</span></p>
                            <div class="styled-select ">
                                <input type="search" name="latitud" [(ngModel)]="latitud" class="fourRounded"
                                    aria-controls="tableModal">
                            </div>
                        </div>

                        <div class="col-xs-12 col-sm-12 col-md-6">
                            <p class="crearConsultaTitulos">Longitud<span class="requerido">*</span></p>
                            <div class="styled-select ">
                                <input type="search" name="longitud" [(ngModel)]="longitud" class="fourRounded"
                                    aria-controls="tableModal">
                            </div>
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-12">
                        <p class="crearConsultaTitulos">Archivo KMZ<span class="requerido">*</span></p>
                        <div class="styled-select">
                            <input #fileInput type="file" (change)="cargarArchivo($event)" placeholder="Cargar Archivo">
                        </div>
                        <br />
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-12">
                        <div class="col-xs-0 col-md-3">

                            <button type="button" (click)="redirigirAListado()" class="btn-custom btn-add btn-mediano">
                                Volver
                            </button>
                        </div>
                        <div class="col-xs-0 col-md-4">
                        </div>

                        <div class="col-xs-0 col-md-3">
                            <button class="btn-custom btn-guardar btn-grande"
                                (click)="campoProveedorAgregar()">Guardar</button>

                        </div>


                    </div>
                </div>
            </div>
            <spinner></spinner>
        </div>
        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
