<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10" style="font-weight: bold;">Generar Consulta</div>
        </div>
        <!--End Title-->
        <!-- Form-->
        <div class="row myRow firstSection mySearch cargaDeDatos">
            <div class="rounded shadow col-xs-12 col-sm-6 col-md-8">
                <div class="row myRow cargaDeDatosFields cargaDeDatosForm" style="padding: 20px;">
                    <div class="col-xs-12 col-sm-6 col-md-6">
                        <p class="crearConsultaTitulos">Proveedor</p>
                        <div class="styled-select ">
                            <input type="search" [(ngModel)]="proveedor" class="fourRounded" placeholder="Proveedor*" aria-controls="tableModal">
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-6">
                        <p class="crearConsultaTitulos">Categor&iacute;a</p>
                        <div class="styled-select perfiles-select">
                            <dropdown #dropdown_categoria [tipoDropdown]="'selectInput'" (select)="setCategoria($event)" [options]="categoriaOptions"></dropdown>
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-12 col-md-12">
                        <p class="crearConsultaTitulos">Asunto</p>
                        <div class="styled-select ">
                            <input type="search" [(ngModel)]="asunto" class="fourRounded" placeholder="Asunto*" aria-controls="tableModal">
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-6">
                        <div class="for myRow">
                            <p class="crearConsultaTitulos">Email</p>
                            <div class="styled-select ">
                                <input type="search" [(ngModel)]="email" class="fourRounded" placeholder="Email*" aria-controls="tableModal">
                            </div>
                        </div>
                        <div class="for myRow">
                            <p class="crearConsultaTitulos">Nombre</p>
                            <div class="styled-select ">
                                <input type="search" [(ngModel)]="nombre" class="fourRounded" placeholder="Nombre*" aria-controls="tableModal">
                            </div>
                        </div>
                        <div class="for myRow">
                            <p class="crearConsultaTitulos">Tel&eacute;fono</p>
                            <div class="styled-select">
                                <input type="search" [(ngModel)]="telefono" class="fourRounded" placeholder="Tel&eacute;fono" aria-controls="tableModal">
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-12 col-md-6">
                        <textarea type="search" [(ngModel)]="comentario" class="fourRounded crearConsultaComentario" placeholder="Comentarios" aria-controls="tableModal" rows="8"></textarea>
                    </div>
                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">
                        Raz&oacute;n Social
                        </p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="razonSocial" name="razonSocial" class="fourRounded" placeholder="Raz&oacute;n Social*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Nombre Vendedor</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="nombreVendedor" name="nombreVendedor" class="fourRounded" placeholder="Nombre Vendedor*" aria-controls="tableModal">
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Contrato</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="contrato" name="contrato" class="fourRounded" placeholder="Contrato*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">CUIT</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="cuit" name="cuit" class="fourRounded" placeholder="CUIT*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Comprobante</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="comprobante" name="comprobante" class="fourRounded" placeholder="Comprobante*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Fecha Pago</p>
                        <div class="styled-select">
                            <div class="input-group date form_datetime" data-provide="datepicker" data-date="" data-date-format="yyyy-MM-dd" data-link-field="dtp_fecha_pago">
                                <input type="text" id="noCursor" readonly />
                                <span class="input-group-addon"><span class="fa fa-calendar "></span></span>
                            </div>
                            <input #dtp_fecha_pago id="dtp_fecha_pago" class="dtp_fecha_pago" value={{fechaPago}} style="visibility: hidden;"/>
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Importe</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="importe" name="importe" class="fourRounded" placeholder="Importe*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Impuesto</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="impuesto" name="impuesto" class="fourRounded" placeholder="Impuesto*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Inscripci&oacute;n</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="inscripcion" name="inscripcion" class="fourRounded" placeholder="Inscripci&oacute;n*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-6" *ngIf="camposAdicionales">
                        <p class="crearConsultaTitulos">Motivo</p>
                        <div class="styled-select">
                            <input type="search" [(ngModel)]="motivo" name="motivo" class="fourRounded" placeholder="Motivo*" aria-controls="tableModal">
                        </div>
                    </div>

                    <div class="col-xs-12 col-sm-12 col-md-12 row">
                        <div class="styled-select">
                            <input #fileInput type="file" (change)="cargarArchivo($event)" placeholder="Cargar Archivo">
                        </div>
                        <br />
                    </div>
                    <!--
                    <div class="col-xs-12 col-sm-12 col-md-4 col-md-offset-4">
                        <re-captcha #recaptchaComponent (captchaResponse)="handleCorrectCaptcha($event)" site_key="6LcuYm4UAAAAAIoEEAYe5mrkPUNemcT4blHgjide"></re-captcha>
                    </div>-->                    
                    <div class="myRow row">
                        <div class="col text-center">
                            <a class="mx-auto d-block" (click)="sendContactoMail()" href="#" style="text-decoration:none!important">
                                <div class="btn-custom btn-mediano btn-add animate align-center btn-enviar">Enviar</div>
                            </a>
                        </div>
                    </div>               
                </div>
            </div>
            <spinner></spinner>
        </div>


        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
