        <div class="row myRow">
            <div class="clearfix myTables">
                <div class="display nowrap dataTable no-footer dtr-inline rounded shadow animate usuarios-list-table">
                    <p-table #dt [columns]="cols" [value]="consultas" dataKey="id" [paginator]="true" [rows]="5" >
                        <ng-template pTemplate="caption">
                            <div class="ui-helper-clearfix" style="text-align: right">
                                <div style="float:left">
                                    <button type="button" pButton icon="fa fa-file-excel-o " iconPos="left" label="Exportar" (click)="dt.exportCSV()" style="background-color:#075088;"></button> &nbsp;
                                    <button type="button" pButton icon="fa fa-refresh" (click)="listarConsultas()" style="background-color: #067935;"></button>
                                </div>
                                <i class="fa fa-search" style="margin:4px 4px 0 0"></i>
                                <input type="text" pInputText size="50" placeholder="Buscar" (input)="dt.filterGlobal($event.target.value, 'contains')" style="width:auto">
                            </div>
                        </ng-template>
                        <ng-template pTemplate="header" let-columns>
                            <tr>
                                <th style="width: 1em"></th>
                                <th style="width: 3em" [pSortableColumn]="'id'">ID
                                    <p-sortIcon [field]="'id'"></p-sortIcon>
                                </th>
                                <th style="width: 10em" [pSortableColumn]="'asunto'">Asunto
                                    <p-sortIcon [field]="'asunto'"></p-sortIcon>
                                </th>
                                <th style="width: 5em" [pSortableColumn]="'estado'">Estado
                                    <p-sortIcon [field]="'estado'"></p-sortIcon>
                                </th>
                                <th style="width: 5em" [pSortableColumn]="'categoria'">Categoria
                                    <p-sortIcon [field]="'categoria'"></p-sortIcon>
                                </th>
                                <th style="width: 7em" [pSortableColumn]="'fechaUltimaModificacion'">Ult. Modif.
                                    <p-sortIcon [field]="'fechaUltimaModificacion'"></p-sortIcon>
                                </th>
                                <th style="width: 2em"></th>
                            </tr>
                            <tr>
                                <th></th>
                                <th *ngFor="let col of columns" [ngSwitch]="col.field">
                                    <input *ngSwitchCase="'id'" pInputText type="text" (input)="dt.filter($event.target.value, col.field, 'equals')" size="5">
                                    <input *ngSwitchCase="'asunto'" pInputText type="text" (input)="dt.filter($event.target.value, col.field, 'contains')" size="30">
                                    <!-- <div *ngSwitchCase="'year'">
                                        Value < {{yearFilter}}
                                        <i class="fa fa-close" (click)="yearFilter=null;dt.filter(null, col.field, col.filterMatchMode)" style="cursor:pointer" *ngIf="yearFilter"></i>
                                        <p-slider [style]="{'width':'100%','margin-top':'8px'}" [(ngModel)]="yearFilter" [min]="2010" [max]="2021" (onChange)="onYearChange($event, dt)"></p-slider>
                                    </div> -->
                                    <!-- <p-dropdown *ngSwitchCase="'brand'" [options]="brands" [style]="{'width':'100%'}" (onChange)="dt.filter($event.value, col.field, 'equals')"></p-dropdown> -->
                                    <p-multiSelect *ngSwitchCase="'estado'" [options]="estadosList" defaultLabel="Todos" (onChange)="dt.filter($event.value, 'idEstado', 'in')">
                                        <ng-template let-estado pTemplate="item">
                                            <span class="label label-default" [ngStyle]="{'background-color': obtenerColorEstado(estado.value)}" >{{estado.label}}</span>
                                        </ng-template>
                                    </p-multiSelect>
                                    <p-multiSelect *ngSwitchCase="'categoria'" [options]="categoriasList" defaultLabel="Todos" (onChange)="dt.filter($event.value, 'idCategoria', 'in')" ></p-multiSelect>
                                    <div *ngSwitchCase="'fechaUltimaModificacion'">
                                        <p-toggleButton [(ngModel)]="desde" onLabel="Desde" offLabel="Desde" (onChange)="cambiarCalendar(dt)"></p-toggleButton>
                                        <p-toggleButton [(ngModel)]="hasta" onLabel="Hasta" offLabel="Hasta" (onChange)="cambiarCalendar(dt)"></p-toggleButton>
                                        <p-calendar #lastdate  [(ngModel)]="fecha" [locale]="es" [showIcon]="true" dateFormat="dd/mm/yyyy" [readonlyInput]="true"
                                        selectionMode="single" (onClose)="onFechaRangeChange(dt)" (onSelect)="onFechaChange(dt)" [style]="{'width':'150%'}"
                                        ></p-calendar>
                                    </div>
                                </th>
                                <th></th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-rowData let-expanded="expanded" let-columns="columns">
                            <tr [pSelectableRow]="rowData">
                                <td>
                                    <a style="cursor: pointer;" [pRowToggler]="rowData" *ngIf="mostrarCamposAdicionales(rowData.idCategoria)">
                                        <i [ngClass]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
                                    </a>
                                </td>
                                <td *ngFor="let col of columns" [ngSwitch]="col.field">
                                    <span *ngSwitchDefault> {{rowData[col.field]}} </span> 
                                    <span class="label label-default" *ngSwitchCase="'estado'" [ngStyle]="{'background-color': obtenerColorEstado(rowData.idEstado)}" >{{rowData[col.field]}}</span>
                                    <span *ngSwitchCase="'fechaUltimaModificacion'" >{{rowData[col.field] | date:'dd/MM/yyyy'}}</span>
                                </td>
                                <td style="text-align: center">
                                    <button pButton type="button" class="p-button-secondary" style="background-color: #067935;" icon="fa fa-comments-o"></button>
                                </td>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="rowexpansion" let-rowData let-columns="columns">
                            <tr>
                                <td [attr.colspan]="columns.length + 2">
                                    <div class="ui-g ui-fluid" style="font-size:16px;padding:20px">
                                       
                                        <div class="ui-g-12 ui-md-12">
                                            <div class="ui-g">
                                                <div class="ui-g-6">
                                                    <b>Razón Social:</b> {{rowData.razonSocial}}
                                                </div>
                                                <div class="ui-g-6">
                                                    <b>Contrato:</b> {{rowData.contrato}}
                                                </div>
                                                <div class="ui-g-6">
                                                    <b>CUIT:</b> {{rowData.cuit}}
                                                </div>
                                                <div class="ui-g-6">
                                                    <b>Comprobante:</b> {{rowData.comprobante}}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>
            </div>
        </div>
