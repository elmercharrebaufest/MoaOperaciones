<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 fixtwobuttons">Aduana: <strong>Detalle de Pesadas</strong> </div>
        </div>
        <!--End Title-->
        <!-- Tables-->
        <div class="row myRow">
            <spinner></spinner>
            <mensaje></mensaje>
            <div class="clearfix myTables" *ngIf="isVisible()">
                <table id="tableModal" class="display nowrap dataTable no-footer dtr-inline rounded shadow animate " cellspacing="0" role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" style="">Fecha y Hora Pesada</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Peso Bruto [Kg]</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Peso Tara [Kg]</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Peso Neto [Kg]</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let pesadaDetalle of pesadasDetalleList | paginate: { itemsPerPage:itemsPerPage, currentPage: p } ; let odd = odd" role="row" class="odd">
                            <td tabindex="0">{{pesadaDetalle.fecha}}</td>
                            <td>{{pesadaDetalle.pesoBruto}}</td>
                            <td>{{pesadaDetalle.pesoTara}}</td>
                            <td>{{pesadaDetalle.pesoNeto}}</td>
                        </tr>
                    </tbody>
                </table>
                <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="isVisible()">
                    <div class="dataTables_paginate paging_simple_numbers">
                        <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()" [class.disabled]="pT.isFirstPage()"> Anterior </a>
                        <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
                            <a class="paginate_button" (click)="pT.setCurrent(page.value)" *ngIf="pT.getCurrent() !== page.value">{{ page.label }}</a>
                            <a class="paginate_button current" *ngIf="pT.getCurrent() === page.value">{{ page.label }}</a>
                        </span>
                        <a id="tableModal_next" class="paginate_button next" (click)="pT.next()" [class.disabled]="pT.isLastPage()"> Siguiente </a>
                    </div>
                </pagination-template>
            </div>
        </div>
        <!-- END tables-->
    </section>
    <!--End CONTENT-->
</div>


<mensaje></mensaje>
