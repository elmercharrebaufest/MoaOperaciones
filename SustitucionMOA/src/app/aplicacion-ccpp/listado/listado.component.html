<div class="content-wraper">
  <!-- CONTENT-->
  <section class="container-fluid clearfix">
    <!--Title-->
    <div class="row titleSection">
      <div class="col-xs-12 col-sm-10 section-title"><strong>Aplicación de CCPP</strong> </div>
      <div class="row align-right">
        <div class="col-xs-12 col-sm-8 col-md-8" style="display: flex; justify-content: flex-end;">
          <a (click)="exportExcelAplicacionesCCPP()" style="text-decoration:none!important">
            <div class="btnSection animate align-right">
              Exportar <img src="Content/images/buttons/EXPORT.svg" />
            </div>
          </a>
        </div>

      </div>
    </div>
    <!--End Title-->
    <!--Search-->
    <div class="row myRow firstSection mySearch">
      <div class="col-xs-12 col-md-12 rounded shadow animate">
        <div class="col-xs-12 col-md-12 bg-white">
          <spinner-small></spinner-small>
          <h3 class="sub-section-title">Refinar resultados</h3>
        </div>
        <div id="searchVer" class="col-xs-12 col-sm-6 col-md-15">
          <p class="filter-title">Ver</p>
          <filtro-fecha (ClickEvent)="getListadoFechas()"></filtro-fecha>
        </div>
        <div id="searchContrato" class="col-xs-12 col-sm-6 col-md-15">
          <p class="filter-title">Contrato</p>
          <div class="styled-select">
            <input type="search" class="" placeholder="" [formControl]="contratoFiltro" aria-controls="tableModal">
          </div>
        </div>
        <div id="searchCCPP" class="col-xs-12 col-sm-6 col-md-15">
          <p class="filter-title">Carta Porte</p>
          <div class="styled-select">
            <input type="search" class="" placeholder="" [formControl]="ccppFiltro" aria-controls="tableModal">
          </div>
        </div>
        <div id="searchEstado" class="col-xs-12 col-sm-6 col-md-15">
          <p class="filter-title">Estado</p>
          <div class="styled-select">
            <dropdown #FiltroEstado  [options]="opcionesEstadoAplicacionCCPP"
              (select)="estadoFiltro.setValue($event)"></dropdown>
          </div>
        </div>
        <div id="searchEstado" class="col-xs-12 col-sm-6 col-md-15">
          <br>
          <button class="btn search-button">
            BUSCAR
          </button>
        </div>
      </div>
    </div>
    <!-- End Search-->
    <!-- Tables-->

    <div class="row myRow">
      <div class="clearfix myTables">
        <mensaje></mensaje>
        <spinner></spinner>
        <table id="tableModal" *ngIf="isVisible"
          class="display nowrap dataTable no-footer dtr-inline rounded shadow animate" role="grid"
          aria-describedby="tableModal_info" style="width: 100%; padding:30px 0;">
          <thead>
            <tr role="row">
              <th tabindex="0" rowspan="1" colspan="1">
                Fecha
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
                Usuario
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
                CTO
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
                CCPP
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
                KGS
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
                Estado
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
                Observaciones
              </th>
              <th tabindex="0" rowspan="1" colspan="1">
              </th>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let aplicacion of aplicaciones | customFilter : 'Contrato' : contratoFiltro.value  | orderedColumn : {property: (orderedByColumn), direction: orderDirection} | paginate: { itemsPerPage:itemsPerPage, currentPage: p } ; let odd = odd"
              role="row" [class.odd]="!odd">
            </tr>
          </tbody>
        </table>

        <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="isVisible">
          <div class="dataTables_paginate paging_simple_numbers">
            <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()"
              [class.disabled]="pT.isFirstPage()"> Anterior </a>
            <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
              <a class="paginate_button" (click)="pT.setCurrent(page.value)" *ngIf="pT.getCurrent() !== page.value">{{
                page.label }}</a>
              <a class="paginate_button current" *ngIf="pT.getCurrent() === page.value">{{ page.label }}</a>
            </span>
            <a id="tableModal_next" class="paginate_button next" (click)="pT.next()" [class.disabled]="pT.isLastPage()">
              Siguiente </a>
          </div>
        </pagination-template>
      </div>
    </div>
    <!-- END tables-->
  </section>
  <!--End CONTENT-->
</div>
