
<div class="content-wraper">
    <mensaje></mensaje>
    <spinner></spinner>
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 ">Resumen de contrato Nro <strong>{{this.contratoId}}</strong> </div>

            <div class="row align-right">
                <div class="col-xs-12 col-sm-8 col-md-8" style="display: flex; justify-content: flex-end;">
                    <a (click)="exportExcelReporteContratoDetalle()" style="text-decoration:none!important">
                        <div class="btnSection animate align-right">
                            Exportar <img src="Content/images/buttons/EXPORT.svg" />
                        </div>
                    </a>
                </div>

            </div>
        </div>



        <div class="row myRow">

            <div class="clearfix myTables">
                <table id="tableModal" class="display nowrap dataTable no-footer dtr-inline rounded shadow animate" cellspacing="0" role="grid" aria-describedby="tableModal_info" style="width: 97%; padding:20px;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Fecha de Pedido</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Fecha de carga</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Cant. Entrega</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Remito</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Factura</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Chasis</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Acoplado</th>
                            <th tabindex="0" rowspan="1" colspan="1" style=" background:none">Chofer</th>
                      
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let det of detalle">
                            <td >{{det.FechaPedido}}</td>
                            <td>{{det.FechaCarga}}</td>
                            <td>{{det.CantidadEntregadaStr}}</td>
                            <td>{{det.Remito}}</td>
                            <td>{{det.Factura}}</td>
                            <td>{{det.Chasis}}</td>
                            <td>{{det.Acoplado}}</td>
                            <td>{{det.Chofer}}</td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!--Fin botones mobile-->
    </section>
    <!--End CONTENT-->
</div>
