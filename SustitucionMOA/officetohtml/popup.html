<body id="top" style="background-color:white;">
    <style>
        .cerrar {
            align-items: center;
            background-attachment: scroll;
            background-clip: border-box;
            background-color: rgb(23, 47, 143);
            background-image: none;
            background-origin: padding-box;
            background-size: auto;
            border-bottom-color: rgb(255, 255, 255);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            border-bottom-style: none;
            border-collapse: collapse;
            border-image-repeat: stretch;
            border-image-slice: 100%;
            border-image-source: none;
            border-image-width: 1;
            border-left-color: rgb(255, 255, 255);
            border-left-style: none;
            border-right-color: rgb(255, 255, 255);
            border-right-style: none;
            border-top-color: rgb(255, 255, 255);
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            box-sizing: border-box;
            color: rgb(255, 255, 255);
            cursor: pointer;
            display: flex;
            font-family: Arial, verdana, sans-serif;
            font-size: 18px;
            font-stretch: 100%;
            font-weight: 400;
            height: 30px;
            letter-spacing: normal;
            line-height: 24px;
            margin-bottom: 0px;
            margin-left: 10px;
            margin-right: 10px;
            outline-color: rgb(255, 255, 255);
            overflow-x: visible;
            overflow-y: visible;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 10px;
            text-align: center;
            text-decoration-color: rgb(255, 255, 255);
            text-decoration-line: none;
            text-decoration-style: solid;
            text-indent: 0px;
            text-rendering: auto;
            text-shadow: none;
            text-size-adjust: 100%;
            text-transform: none;
            touch-action: manipulation;
            user-select: none;
            vertical-align: middle;
            white-space: nowrap;
            width: 189.078px;
            writing-mode: horizontal-tb;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            -webkit-border-image: none;
            width: 120px;
            display: inline-flex;
        }
    </style>
    <div class="wrapper row3">
        <main class="  " style="padding:0;">

            <!-- ################################################################################################ -->
            <div class="content" style="margin-left:20px;">
                <div id="resolte-div" style="overflow: hidden;">
                    <div id="resolte-contaniner" style="width: 800px; height:796px; overflow: auto;"></div>
                </div>
                <script type="text/javascript">
                    var url;

                    $("#a_file").click(function () {
                        var link = document.createElement("a");
                        document.body.appendChild(link);
                        link.href = url;
                        link.download = result.FileDownloadName;
                        link.click();
                        setTimeout(function () { window.URL.revokeObjectURL(url); }, 0);
                    });
                    (function ($) {
                        $("#resolte-contaniner").css("height", "796px");


                        const queryString = window.location.search;
                        const urlParams = new URLSearchParams(queryString);
                        var filePath = urlParams.get('filePath');
                        
                        $("#resolte-contaniner").officeToHtml({
                                    url: filePath,
                                    //inputObjId: "select_file",
                                    pdfSetting: {
                                        setLang: "",
                                        setLangFilesPath: "" /*"include/pdf/lang/locale" - relative to app path*/
                                    }
                                });

                    }(jQuery));
                </script>
            </div>
        </main>
    </div>


</body>
