<div class="content-wraper">
    <!-- CONTENT-->

    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 ">Usuario: <strong>Listado</strong> </div>
        </div>
        <!--End Title-->
        
        <div class="row myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow animate">
                <title-caps>Refinar resultados</title-caps>
                <hr>
                <div class="col-xs-12 col-sm-12 col-md-6">
                    Por Usuario/Vendedor:
                    <div class="styled-select">
                        <input type="search" class="" placeholder="" [value]="filtroUsuarioVendedor" (input)="filtroUsuarioVendedor = $event.target.value" aria-controls="tableModal">
                    </div>
                </div>
            </div>
        </div>

        <div class="row myRow">
            <div class="clearfix myTables">
                <mensaje></mensaje>
                <spinner></spinner>
                <table *ngIf="isVisible()" id="tableModal" class="display nowrap dataTable no-footer dtr-inline rounded shadow animate usuarios-list-table" cellspacing="0" role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('id')">ID</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('usuario')">Usuario</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('vendedor')">Vendedor</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="" (click)="orderColumnBy('tipo')">Tipo</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Desbloquear</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Hab/Deshab</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let usuario of data | orderedColumn : {property: orderedByColumn, direction: orderDirection} | customFilterOr : 'usuario' : 'vendedor' : filtroUsuarioVendedor | paginate: { itemsPerPage:itemsPerPage, currentPage: p } ; let odd = odd" role="row" [class.odd]="!odd">
                            <td><a (click)="showModalTableResponsive(usuario)" class="btnShowModal"><i class="fa fa-plus fa-lg" aria-hidden="true"></i></a> {{usuario.id}}</td>
                            <td><a (click)="showModalTableResponsive(usuario)" class="btnShowModal"><i class="fa fa-plus fa-lg" aria-hidden="true"></i></a>{{usuario.usuario}}</td>
                            <td>{{usuario.vendedor}}</td>
                            <td>{{usuario.tipo}}</td>
                            <td><a class="animate" (click)="desbloquear(usuario.usuario)" href="#" *ngIf=isBloqueado(usuario.bloqueo)>Desbloquear</a><span *ngIf=!isBloqueado(usuario.bloqueo)>Desbloqueado</span></td>
                            <td><a class="animate" (click)="deshabilitar(usuario.usuario)" href="#" *ngIf=isHabilitado(usuario.estado)>Deshabilitar</a><a class="animate" (click)="habilitar(usuario.usuario)" href="#" *ngIf=!isHabilitado(usuario.estado)>Habilitar</a></td>
                        </tr>
                    </tbody>
                </table>

                <pagination-template #pT="paginationApi" (pageChange)="p = $event" *ngIf="isVisible()">
                    <div class="dataTables_paginate paging_simple_numbers">
                        <a id="tableModal_previous" class="paginate_button previous" (click)="pT.previous()" [class.disabled]="pT.isFirstPage()"> Anterior </a>
                        <span *ngFor="let page of pT.pages" [class.current]="pT.getCurrent() === page.value">
                            <a class="paginate_button" (click)="pT.setCurrent(page.value)" *ngIf="pT.getCurrent() !== page.value">{{ page.label }}</a>
                            <a class="paginate_button current" *ngIf="pT.getCurrent() === page.value">{{ page.label }}</a>
                        </span>
                        <a id="tableModal_next" class="paginate_button next" (click)="pT.next()" [class.disabled]="pT.isLastPage()"> Siguiente </a>
                    </div>
                </pagination-template>
            </div>
        </div>
        <!-- END tables-->


        <!-- END form-->
    </section>
    <!--End CONTENT-->
</div>
