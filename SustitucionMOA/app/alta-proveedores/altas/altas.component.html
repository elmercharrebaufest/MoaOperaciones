<div class="content-wraper">
    <!-- CONTENT-->
    <section class="container-fluid clearfix">
        <!--Title-->
        <div class="row titleSection">
            <div class="col-xs-12 col-sm-10 ">Altas de proveedores <strong>Pendientes</strong> </div>
        </div>
        <!--End Title-->
        <!--Search-->
        <div class="row  myRow firstSection mySearch">
            <div class="col-xs-12 col-md-12 rounded shadow">
                <div>
                    <title-caps>Refinar resultados</title-caps>
                </div>
                <div id="searchTexto" class="col-xs-6 col-sm-6 col-md-6 ">
                    Por CUIT N°:
                    <div class="styled-select ">
                        <input type="search" class="" placeholder="" aria-controls="tableModal">
                    </div>
                </div>
            </div>
        </div>
        <!-- End Search-->
        <!-- Tables-->
        <div class="row myRow">
            <div class="clearfix myTables">
                <mensaje></mensaje>
                <spinner></spinner>
                <table id="tableModal" class="display nowrap dataTable no-footer dtr-inline rounded shadow ccpp-table"
                    cellspacing="0" role="grid" aria-describedby="tableModal_info" style="width: 100%; padding:10px 0;">
                    <thead>
                        <tr role="row">
                            <th tabindex="0" rowspan="1" colspan="1" style="">Fecha</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">CUIT</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Estado</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Detalle</th>
                            <th tabindex="0" rowspan="1" colspan="1" style="">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- <tr *ngFor="let recepcionInfo of cartaPorteList.cartasPorte | paginate: { itemsPerPage:itemsPerPage, currentPage: p }" -->
                        <!-- role="row" class="odd"> -->
                        <tr>
                            <td>Fecha</td>
                            <td>CUIT</td>
                            <td>Estado</td>
                            <td>
                                <button (click)="verDetalle()">Ver detalle</button>
                            </td>
                            <td>
                                <button>Aceptar</button>
                                <button>Rechazar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <pagination-controls-custom (pageChange)="p = $event" *ngIf="cartaPorteList">
                </pagination-controls-custom>
            </div>
        </div>
        <!-- END tables-->
    </section>
    <!--End CONTENT-->
</div>
